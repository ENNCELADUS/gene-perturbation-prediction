# The default linear context prior (default_prior.yaml) refitted on the SL split
# (configs/benchmarks/cell_line_sl_split.json): the multi-study SL benchmark's baselines read its
# export as the predicted GeneEffect of the SL validation and test lines.
seed: 0
joint_config: configs/revision/frozen_huber_sl_split.yaml
output_root: outputs/context_prior
paths:
  reference: configs/context_prior/reference
  model: data/sl_dependency_v0/raw/depmap/Model.csv
  bulk_expression: data/sl_dependency_v0/raw/depmap/OmicsExpressionTPMLogp1HumanProteinCodingGenes.csv
training_side:
  exclude_lineages: [Lymphoid, Myeloid]
prior: {components: 128, folds: 5, bootstrap_repeats: 1000, selected_genes: 50}
penalties:
  components: [1.0]
  gene: [10.0]
block_sets:
  selected: [expression_components, data_selected]
reference: {experiment: affine, block_set: selected, components_penalty: 1.0, gene_penalty: 10.0}
experiments:
  affine:
    kind: affine
    settings: [{}]
    block_sets: [selected]
