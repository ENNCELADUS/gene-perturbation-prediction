# Single-cell statistics stacked on the default prior's out-of-fold export (GeneEffect protocol
# §13): does a line's basal single-cell distribution add to what its pseudo-bulk gives the prior?
# The mean arm (log-space mean, close to pseudo-bulk) is the like-for-like control; the
# distribution arm reads only the detected fraction and variance; single_cell reads all three.
# Every row is reported on validation and test; nothing is chosen in code. Stacks on the default prior
# rerun on the split with A549 in test (default_prior_resplit_20261012); the 2026-10-11 runs stacked on
# default_prior_export, of the 172/27/27 split.
seed: 0
output_root: outputs/context_prior
prior_run: outputs/context_prior/default_prior_resplit_20261012
bootstrap_repeats: 1000
selected_genes: 50
penalties:
  own: [1.0, 10.0, .inf]
  selected: [1.0, 10.0, 100.0]
arms:
  mean: [mean]
  distribution: [detected, variance]
  single_cell: [mean, detected, variance]
