data:
  h5ad_path: data/sl_dependency_v0/raw/replogle/K562_essential_normalized_singlecell_01.h5ad
  overlap_csv: data/sl_dependency_v0/interim/k562_replogle_depmap_overlap.csv
  output_dir: results/experiments/01_replogle_k562_pseudobulk_b_to_c_and_adamson_transfer
  obs_perturbation_col: gene
  control_label: non-targeting
  var_gene_symbol_col: gene_name
  depmap_label_col: depmap_gene_effect
  matched_label_col: has_depmap_label
  n_cells_col: n_cells_or_pseudobulk
  external_overlap_csvs:
    - data/sl_dependency_v0/interim/k562_adamson_depmap_overlap.csv
  external_evaluations:
    - name: adamson_k562
      features_npz: results/experiments/01_replogle_k562_pseudobulk_b_to_c_and_adamson_transfer/features/external/adamson_k562/adamson_k562_features.npz
  external_feature_sources:
    - name: adamson_pilot
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_pilot.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: gene_name
    - name: adamson_upr_epistasis
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_upr_epistasis.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: gene_name
    - name: adamson_upr_perturb_seq
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_upr_perturb_seq.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: gene_name

experiment:
  name: replogle_k562_pseudobulk_adamson_transfer_grid
  seed: 42
  run_id: null
  human_result_tables: [summary_metrics]
  machine_result_format: parquet
  checkpoint_policy: all_cv_and_final
  save_predictions: true
  save_rankings: true
  save_splits: true
  topk_candidates: [20, 50, 100]

features:
  chunk_size: 4096
  top_abs_delta_sizes: [50, 100, 500]

cv:
  n_splits: 5
  n_repeats: 1
  random_state: 42
  stratify_bins: 10
  pca_components: [20, 50, 100]
  model_set: full
  essential_thresholds: [-0.5, -1.0]

selection:
  scopes: [internal_cv_all]
  features: [delta_all]
  models: null
  folds: null
  weightings: [unweighted]

models:
  mean_label:
    enabled: false
  ridge:
    enabled: true
    variants:
      - alpha: 1.0
      - alpha: 10.0
      - alpha: 100.0
  elastic_net:
    enabled: false
  pca_ridge:
    enabled: true
    variants:
      - components: 20
        alpha: 1.0
      - components: 20
        alpha: 10.0
      - components: 20
        alpha: 100.0
      - components: 50
        alpha: 1.0
      - components: 50
        alpha: 10.0
      - components: 50
        alpha: 100.0
      - components: 100
        alpha: 1.0
      - components: 100
        alpha: 10.0
      - components: 100
        alpha: 100.0
  random_forest:
    enabled: false
  pca_random_forest:
    enabled: true
    n_estimators: 300
    n_jobs: -1
    variants:
      - components: 20
        min_samples_leaf: 3
      - components: 20
        min_samples_leaf: 5
      - components: 20
        min_samples_leaf: 10
      - components: 50
        min_samples_leaf: 3
      - components: 50
        min_samples_leaf: 5
      - components: 50
        min_samples_leaf: 10
      - components: 100
        min_samples_leaf: 3
      - components: 100
        min_samples_leaf: 5
      - components: 100
        min_samples_leaf: 10
  xgboost:
    enabled: true
    n_estimators: 300
    subsample: 0.8
    colsample_bytree: 0.8
    objective: reg:squarederror
    n_jobs: 4
    variants:
      - max_depth: 2
        learning_rate: 0.03
      - max_depth: 2
        learning_rate: 0.1
      - max_depth: 3
        learning_rate: 0.03
      - max_depth: 3
        learning_rate: 0.1
      - max_depth: 4
        learning_rate: 0.03
      - max_depth: 4
        learning_rate: 0.1
