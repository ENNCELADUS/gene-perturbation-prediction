data:
  h5ad_path: data/sl_dependency_v0/raw/replogle/K562_essential_normalized_singlecell_01.h5ad
  overlap_csv: data/sl_dependency_v0/interim/k562_replogle_depmap_overlap.csv
  output_dir: results/experiments/02_replogle_k562_viability_axis_audit
  obs_perturbation_col: gene
  control_label: non-targeting
  var_gene_symbol_col: gene_name
  depmap_label_col: depmap_gene_effect
  matched_label_col: has_depmap_label
  n_cells_col: n_cells_or_pseudobulk
  external_overlap_csvs: []
  external_evaluations: []

experiment:
  name: replogle_k562_viability_axis_extended_5x5
  seed: 42
  run_id: null
  human_result_tables: [summary_metrics]
  machine_result_format: parquet
  checkpoint_policy: all_cv_and_final
  save_predictions: true
  save_rankings: true
  save_splits: true
  topk_candidates: [20, 50, 100]

features:
  chunk_size: 4096
  top_abs_delta_sizes: [50, 100, 500]

viability_axis:
  enabled: true
  artifacts:
    - name: achilles
      url: https://raw.githubusercontent.com/bence-szalai/Cell-death-signatures/master/models/achilles.csv
      sha256: ea1f1847c6f7d07c06e80f8156e1bd0309dc875285fdc7874356060f3d527793
    - name: ctrp
      url: https://raw.githubusercontent.com/bence-szalai/Cell-death-signatures/master/models/ctrp.csv
      sha256: 1d753ad074c13cdda7669d7c99c9337374f2724856da25f07056ba096f42480f

cv:
  n_splits: 5
  n_repeats: 5
  random_state: 42
  stratify_bins: 10
  pca_components: [50]
  model_set: full
  essential_thresholds: [-0.5, -1.0]

selection:
  scopes: [internal_cv_all]
  features:
    - delta_all
    - delta_mask_target
    - response_burden
    - nar_viability_scores
    - nar_viability_scores_plus_burden
    - nar_resid_delta_all
    - nar_resid_delta_mask_target
  models:
    - ridge
    - pca50_ridge
    - random_forest
    - pca50_random_forest
    - nar_score_ridge
    - nar_score_plus_burden_ridge
    - nar_resid_pca50_ridge
    - nar_resid_pca50_random_forest
  weightings: [unweighted]

models:
  mean_label:
    enabled: false
  ridge:
    enabled: true
    alpha: 10.0
  elastic_net:
    enabled: false
  pca_ridge:
    enabled: true
    components: [50]
    alpha: 10.0
  random_forest:
    enabled: true
    n_estimators: 300
    min_samples_leaf: 5
    n_jobs: -1
  pca_random_forest:
    enabled: true
    components: [50]
    n_estimators: 300
    min_samples_leaf: 5
    n_jobs: -1
  xgboost:
    enabled: false
  nar_viability_axis:
    enabled: true
    alpha: 10.0
    n_score_columns: 2
    n_estimators: 300
    min_samples_leaf: 5
    n_jobs: -1
