data:
  h5ad_path: data/sl_dependency_v0/raw/replogle/K562_essential_normalized_singlecell_01.h5ad
  overlap_csv: data/sl_dependency_v0/interim/k562_replogle_depmap_overlap.csv
  output_dir: results/experiments/03_replogle_k562_single_cell_deepsets_adamson/distribution_prototype_regression
  obs_perturbation_col: gene
  control_label: non-targeting
  var_gene_symbol_col: gene_name
  depmap_label_col: depmap_gene_effect
  matched_label_col: has_depmap_label
  n_cells_col: n_cells_or_pseudobulk
  external_overlap_csvs:
    - data/sl_dependency_v0/interim/k562_adamson_depmap_overlap.csv
  external_feature_sources:
    - name: adamson_pilot
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_pilot.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: gene_name
    - name: adamson_upr_epistasis
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_upr_epistasis.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: gene_name
    - name: adamson_upr_perturb_seq
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_upr_perturb_seq.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: gene_name

experiment:
  name: replogle_k562_single_cell_distribution_prototype_regression
  seed: 42
  run_id: null
  human_result_tables: [summary_metrics]
  machine_result_format: parquet
  checkpoint_policy: all_cv_and_final
  save_predictions: true
  save_rankings: false
  save_splits: true
  topk_candidates: [20, 50, 100]

features:
  chunk_size: 4096
  top_abs_delta_sizes: [50, 100, 500]

single_cell:
  feature_sets:
    - single_cell_pc_delta
    - single_cell_scvi_delta
    - single_cell_hvg_delta
  n_hvg: 2000
  n_pcs: 128
  scvi_latent_dim: 128
  scvi_hidden_units: 128
  scvi_layers: 1
  scvi_max_epochs: 400
  scvi_batch_size: 128
  max_cells_per_bag: 256
  device: auto

distribution:
  component_counts: [32]
  sensitivity_component_counts: [16, 64]
  covariance_type: diag
  prototype_fit_scope: train_genes_plus_controls
  feature_blocks: occupancy_first
  views: [centered, deltap]
  weightings: [unweighted]
  ridge_alphas: [1.0, 10.0, 100.0]
  random_forest_n_estimators: 300
  random_forest_min_samples_leaf: 5
  random_forest_n_jobs: -1
  mlp_hidden_units: [32]
  mlp_max_epochs: 300
  mlp_patience: 30
  cloudpred_hidden_units: [32]
  cloudpred_learning_rate: 0.001
  cloudpred_weight_decay: 0.001
  cloudpred_max_epochs: 300
  cloudpred_patience: 30
  cloudpred_validation_fraction: 0.15
  cloudpred_batch_size: 32
  max_gmm_fit_cells: null
  max_cells_per_bag: 512
  device: auto

cv:
  n_splits: 5
  n_repeats: 1
  random_state: 42
  stratify_bins: 10
  pca_components: [20, 50, 100]
  model_set: full
  essential_thresholds: [-0.5, -1.0]

selection:
  scopes: [internal_cv_all]
  features:
    - single_cell_pc_delta
    - single_cell_scvi_delta
    - single_cell_hvg_delta
  models: null
  folds: null
  weightings: [unweighted]

models: {}
