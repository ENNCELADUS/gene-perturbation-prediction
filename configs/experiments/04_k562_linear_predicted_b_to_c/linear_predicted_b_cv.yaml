data:
  h5ad_path: data/sl_dependency_v0/raw/replogle/K562_essential_normalized_singlecell_01.h5ad
  overlap_csv: data/sl_dependency_v0/interim/k562_replogle_depmap_overlap.csv
  output_dir: results/experiments/04_k562_linear_predicted_b_to_c
  obs_perturbation_col: gene
  control_label: non-targeting
  var_gene_symbol_col: gene_name
  depmap_label_col: depmap_gene_effect
  matched_label_col: has_depmap_label
  n_cells_col: n_cells_or_pseudobulk

experiment:
  name: k562_linear_predicted_b_to_c
  seed: 42
  run_id: null
  human_result_tables: [summary_metrics]
  machine_result_format: parquet
  checkpoint_policy: all_cv_and_final
  save_predictions: true
  save_rankings: false
  save_splits: true
  topk_candidates: [20, 50, 100]

features:
  chunk_size: 4096
  top_abs_delta_sizes: [50, 100, 500]

single_cell:
  feature_sets: [single_cell_scvi_delta]
  n_hvg: 2000
  n_pcs: 128
  scvi_latent_dim: 128
  scvi_hidden_units: 128
  scvi_layers: 1
  scvi_max_epochs: 400
  scvi_batch_size: 128
  max_cells_per_bag: 256
  device: auto

distribution:
  max_gmm_fit_cells: null
  max_cells_per_bag: 512
  device: auto

predicted_b:
  feature_set: single_cell_scvi_delta
  methods: [mean_delta_ridge, pseudo_pair_ridge]
  a_to_b_alpha: 10.0
  gmm_components: 64
  gmm_view: centered
  c_ridge_alpha: 300.0
  predicted_cells_per_gene: capped_control_panel
  max_pred_cells_per_gene: 512
  max_pair_samples_per_gene: 64
  pairing_strata_cols: []
  mask_value: 0.0
  clip_min: 0.0
  scvi_query_batch_cells: 8192

cv:
  n_splits: 5
  n_repeats: 1
  random_state: 42
  stratify_bins: 10
  pca_components: [20, 50, 100]
  model_set: full
  essential_thresholds: [-0.5, -1.0]

selection:
  scopes: [internal_cv_all]
  features: [single_cell_scvi_delta]
  models: null
  folds: null
  weightings: [unweighted]

models: {}
