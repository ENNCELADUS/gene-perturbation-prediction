# Fixed K562 gene-role run. Replogle and non-Replogle conditions are pooled by
# target gene before the single train/validation/internal-test assignment.
data:
  h5ad_path: data/sl_dependency_v0/raw/replogle/K562_gwps_normalized_singlecell_01.h5ad
  overlap_csv: data/sl_dependency_v0/interim/k562_gwps_depmap_overlap.csv
  prepared_cache_dir: data/exp05_cache/k562_gwps_state2000_v2
  output_dir: results/experiments/05_aivc_a_to_b_to_c
  obs_perturbation_col: gene
  control_label: non-targeting
  obs_cell_type_col: null
  obs_batch_col: gem_group
  var_gene_symbol_col: gene_name
  state_embed_key: X_hvg
  state_hvg_n_top_genes: null
  depmap_label_col: depmap_gene_effect
  matched_label_col: has_depmap_label
  min_cells_per_gene: 8
  cache_seed: 42
  cache_cells_per_gene: 256

cv:
  n_splits: 5
  expected_gene_count: 9338
  outer_split_manifest: data/sl_dependency_v0/splits/k562_gwps_depmap_outer5_seed42.csv
  outer_split_sha256_file: data/sl_dependency_v0/splits/k562_gwps_depmap_outer5_seed42.csv.sha256
  fixed_split_manifest: data/sl_dependency_v0/splits/k562_pool_depmap_fixed_seed42.csv
  fixed_split_sha256_file: data/sl_dependency_v0/splits/k562_pool_depmap_fixed_seed42.csv.sha256
  inner_val_fraction: 0.1
  random_state: 42
  stratify_bins: 10

external_test:
  # Compatibility loader: fixed-split orchestration merges these response bags
  # into the K562 pool and does not evaluate them as an external test.
  name: k562_non_replogle_supplement
  overlap_csv: data/sl_dependency_v0/interim/k562_non_replogle_depmap_overlap.csv
  sources:
    - name: adamson_pilot
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_pilot.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: null
    - name: adamson_upr_epistasis
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_upr_epistasis.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: null
    - name: adamson_upr_perturb_seq
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_upr_perturb_seq.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: null
    - name: dixit_2016
      h5ad_path: data/sl_dependency_v0/raw/dixit/dixit_2016.h5ad
      obs_perturbation_col: perturbation_name
      control_label: control
      var_gene_symbol_col: null

state:
  backend: state_checkpoint
  model_dir: model/checkpoints/state/ST-HVG-Replogle/fewshot/k562
  checkpoint_path: model/checkpoints/state/ST-HVG-Replogle/fewshot/k562/checkpoints/final.ckpt
  input_dim: 2000
  output_dim: 2000
  pert_dim: 2024
  gene_tokenizer: esm2
  esm2_npz: data/esm2/k562_gwps_depmap_esm2_650M.npz
  esm2_adapter_hidden: 512
  require_resolved_esm2: true
  representation_layer: output

response_encoder:
  input_dim: 2000
  latent_dim: 128

gmm:
  n_components: 64
  covariance_floor: 0.0001
  init_scale: 0.02
  trainable: true

model:
  c_hidden_units: [64, 32]
  dropout: 0.1

loss:
  latent_mean_delta_weight: 0.1
  latent_energy_weight: 0.0
  hvg_mean_delta_weight: 0.01
  hvg_energy_weight: 0.0
  pred_c_weight: 2.0
  obs_c_weight: 0.25
  occupancy_weight: 0.1
  gmm_nll_weight: 0.01
  pred_rank_weight: 5.0
  pred_rank_tau: 0.25
  pred_rank_pair_margin: 0.25
  pred_rank_pair_weight_clip: 2.0
  b_loss_anneal_epochs: 5
  b_loss_anneal_final_fraction: 0.1

train:
  run_id: exp05_fixed_k562_pool_v1
  seed: 42
  max_epochs: 20
  learning_rate: 0.000025
  state_learning_rate: 0.0000025
  weight_decay: 0.0001
  max_grad_norm: 1.0
  cell_set_len: 64
  gene_batch_size: 4
  eval_control_panel_size: 4096
  eval_window_macro_batch_size: 64
  required_world_size: 4
  device: auto
  float32_matmul_precision: high
