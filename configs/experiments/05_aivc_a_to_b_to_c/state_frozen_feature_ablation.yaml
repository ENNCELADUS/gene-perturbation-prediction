# Frozen STATE feature ablation for predicted-B->C validation.
# Run with:
# uv run python src/aivc_model/state_feature_ablation.py --config configs/experiments/05_aivc_a_to_b_to_c/state_frozen_feature_ablation.yaml

data:
  h5ad_path: data/sl_dependency_v0/raw/replogle/K562_essential_normalized_singlecell_01.h5ad
  overlap_csv: data/sl_dependency_v0/interim/k562_replogle_depmap_overlap.csv
  output_dir: results/experiments/05_aivc_a_to_b_to_c
  obs_perturbation_col: gene
  control_label: non-targeting
  obs_batch_col: gem_group
  state_embed_key: X_hvg
  state_hvg_n_top_genes: 2000
  scvi_obsm_key: null
  var_gene_symbol_col: gene_name
  depmap_label_col: depmap_gene_effect
  matched_label_col: has_depmap_label
  min_cells_per_gene: 8

split:
  train_fraction: 0.8
  val_fraction: 0.2
  test_fraction: 0.0
  random_state: 42
  stratify_bins: 10

external_test:
  name: adamson_k562
  overlap_csv: data/sl_dependency_v0/interim/k562_adamson_depmap_overlap.csv
  sources:
    - name: adamson_pilot
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_pilot.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: gene_name
    - name: adamson_upr_epistasis
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_upr_epistasis.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: gene_name
    - name: adamson_upr_perturb_seq
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_upr_perturb_seq.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: gene_name

cv:
  n_splits: 5
  n_repeats: 1
  random_state: 42
  stratify_bins: 10
  essential_thresholds: [-0.5, -1.0]

experiment:
  name: state_frozen_feature_ablation
  run_id: state_frozen_feature_ablation
  seed: 42
  human_result_tables: [summary_metrics]
  machine_result_format: parquet
  save_predictions: true
  save_rankings: false
  save_splits: true

state:
  backend: state_checkpoint
  model_dir: model/checkpoints/state/ST-HVG-Replogle/fewshot/k562
  checkpoint_path: model/checkpoints/state/ST-HVG-Replogle/fewshot/k562/checkpoints/final.ckpt
  known_perturbation_vectors: model/checkpoints/state/ST-HVG-Replogle/fewshot/k562/pert_onehot_map.pt
  freeze: true

projector:
  teacher: scvi
  latent_dim: 128
  ridge_alpha: 1.0
  trainable: false
  scvi_max_epochs: 100
  scvi_batch_size: 256
  scvi_num_workers: 4
  scvi_hidden_units: 128
  scvi_layers: 2
  scvi_dropout: 0.1
  scvi_disable_lightning_logger: true
  scvi_suppress_slurm_warning: true

gmm:
  n_components: 64
  covariance_floor: 0.0001
  max_fit_cells: 20000

single_cell:
  feature_sets: [single_cell_scvi_delta, single_cell_hvg_delta]
  scvi_latent_dim: 128
  n_hvg: 2000
  scvi_max_epochs: 100
  scvi_batch_size: 256
  max_cells_per_bag: 512

distribution:
  component_counts: [64]
  sensitivity_component_counts: []
  covariance_type: diag
  prototype_fit_scope: train_genes_plus_controls
  views: [centered, deltap]
  ridge_alphas: [30.0, 300.0]
  weightings: [unweighted]
  max_gmm_fit_cells: 20000
  max_cells_per_bag: 512

predicted_b:
  feature_set: single_cell_scvi_delta
  methods:
    - state_output_scvi128_gmm_ridge
    - state_output_hvg_gmm_ridge
    - state_token_hidden_gmm_ridge
  gmm_components: 64
  gmm_view: centered
  c_ridge_alpha: 300.0
  predicted_cells_per_gene: capped_control_panel
  max_pred_cells_per_gene: 512

state_feature_ablation:
  run_id: state_frozen_feature_ablation
  seed: 42
  n_splits: 5
  max_control_cells_per_gene: 512
  gmm_components: 64
  gmm_view: centered
  sensitivity_views: [deltap]
  ridge_alphas: [30.0, 300.0]
  primary_scope: external_ensemble_target_heldout:adamson_k562
  primary_metric: spearman
  interpretation: adamson_guided_validation_sweep
  arms:
    - observed_scvi128_gmm_ridge_anchor
    - state_output_scvi128_gmm_ridge
    - state_output_hvg_gmm_ridge
    - state_token_hidden_gmm_ridge
  arm_details:
    observed_scvi128_gmm_ridge_anchor:
      input: observed_replogle_b
      representation: fold_local_scvi128
    state_output_scvi128_gmm_ridge:
      input: state_predicted_output
      representation: fold_local_scvi128
    state_output_hvg_gmm_ridge:
      input: state_predicted_output
      representation: hvg_output_space
    state_token_hidden_gmm_ridge:
      input: state_token_hidden
      representation: state_token_hidden
      control_embedding_path: same_path_non_targeting
