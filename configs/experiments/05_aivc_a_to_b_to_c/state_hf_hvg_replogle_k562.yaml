# Download the minimal STATE run folder before training:
# uv run python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='arcinstitute/ST-HVG-Replogle', local_dir='model/checkpoints/state/ST-HVG-Replogle', allow_patterns=['fewshot/k562/config.yaml','fewshot/k562/var_dims.pkl','fewshot/k562/pert_onehot_map.pt','fewshot/k562/batch_onehot_map.*','fewshot/k562/cell_type_onehot_map.*','fewshot/k562/checkpoints/final.ckpt','MODEL_LICENSE.md','MODEL_ACCEPTABLE_USE_POLICY.md'])"

data:
  h5ad_path: data/sl_dependency_v0/raw/replogle/K562_essential_normalized_singlecell_01.h5ad
  overlap_csv: data/sl_dependency_v0/interim/k562_replogle_depmap_overlap.csv
  output_dir: results/experiments/05_aivc_a_to_b_to_c
  obs_perturbation_col: gene
  control_label: non-targeting
  obs_cell_type_col: null
  obs_batch_col: gem_group
  state_embed_key: X_hvg
  state_hvg_n_top_genes: 2000
  scvi_obsm_key: null
  depmap_label_col: depmap_gene_effect
  matched_label_col: has_depmap_label
  min_cells_per_gene: 8

split:
  train_fraction: 0.9
  val_fraction: 0.1
  test_fraction: 0.0
  random_state: 42
  stratify_bins: 10

external_test:
  name: adamson_k562
  overlap_csv: data/sl_dependency_v0/interim/k562_adamson_depmap_overlap.csv
  sources:
    - name: adamson_pilot
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_pilot.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: gene_name
    - name: adamson_upr_epistasis
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_upr_epistasis.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: gene_name
    - name: adamson_upr_perturb_seq
      h5ad_path: data/sl_dependency_v0/raw/adamson/adamson_2016_upr_perturb_seq.h5ad
      obs_perturbation_col: perturbation
      var_gene_symbol_col: gene_name

state:
  backend: state_checkpoint
  model_dir: model/checkpoints/state/ST-HVG-Replogle/fewshot/k562
  checkpoint_path: model/checkpoints/state/ST-HVG-Replogle/fewshot/k562/checkpoints/final.ckpt
  embed_key: X_hvg
  input_dim: null
  output_dim: null
  pert_dim: null
  hidden_dim: 768
  cell_set_len: 256
  allow_mock: false
  known_perturbation_vectors: model/checkpoints/state/ST-HVG-Replogle/fewshot/k562/pert_onehot_map.pt

projector:
  teacher: scvi
  latent_dim: 128
  ridge_alpha: 1.0
  trainable: true
  scvi_max_epochs: 100
  scvi_batch_size: 256
  scvi_num_workers: 4
  scvi_hidden_units: 128
  scvi_layers: 2
  scvi_dropout: 0.1
  scvi_disable_lightning_logger: true
  scvi_suppress_slurm_warning: true

gmm:
  n_components: 64
  covariance_floor: 0.0001
  max_fit_cells: 20000

model:
  c_hidden_units: [64, 32]
  dropout: 0.1

loss:
  latent_mean_delta_weight: 1.0
  latent_energy_weight: 1.0
  hvg_mean_delta_weight: 0.1
  hvg_energy_weight: 0.1
  pred_c_weight: 1.0
  obs_c_weight: 0.25
  occupancy_weight: 0.1

train:
  run_id: state_hvg_replogle_k562
  seed: 42
  max_epochs: 50
  learning_rate: 0.000025
  weight_decay: 0.0001
  cell_set_len: 256
  gene_batch_size: 4
  device: auto
  float32_matmul_precision: high
