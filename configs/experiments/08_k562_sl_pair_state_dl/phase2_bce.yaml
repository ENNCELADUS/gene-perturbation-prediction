# exp08 Phase 2 -- SL classification + distillation gate before bag-supervision.
# Bag loss is off (lambda_bag=0); SL BCE (lambda_sl=1.0) drives ranking while
# STATE distillation (lambda_distill 0.5 -> 0.1 after warmup) regularizes the
# adapter. Phase 3 turns on lambda_bag.
input_csv: data/SL_benchmark/derived/k562_depmap_rand_1to1/all_CV_Rand_1to1_k562_depmap_pairs_balanced.csv
output_dir: results/experiments/08_k562_sl_pair_state_dl/phase2_bce_cv2_cv3_lr3e4_ep30
split_types: [CV2, CV3]
folds: [0, 1, 2, 3, 4]
ranking_k: [10, 20, 50]
seed: 17
esm2_npz: data/esm2/k562_sl_universe_esm2_650M.npz
state_backend: state_checkpoint
gwps_h5ad: data/sl_dependency_v0/raw/replogle/K562_gwps_normalized_singlecell_01.h5ad
bags_npz: data/exp08_cache/k562_gwps_bags.npz
lambda_sl: 1.0
lambda_distill: 0.5
lambda_distill_after_warmup: 0.1
lambda_bag: 0.0
warmup_epochs: 1
max_epochs: 30
early_stop_patience: 5
batch_pairs: 128
lr: 0.0003
include_coverage_flag: false
fallback_strategy: zero
