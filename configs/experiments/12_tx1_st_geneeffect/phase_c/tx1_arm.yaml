# Phase C -- Tx1-3B-ST arm (Wave 2 Task 7), the lead encoder arm.
#
# ST's INPUT is the frozen Tx1-3B basal-cell embedding (2560-d, obsm view);
# ST's OUTPUT stays gene/HVG space (2000-d) -- input space and output space
# are decoupled (spec Sec 2.2). The response encoder is target-space, so it
# stays input_dim: 2000 in this config too (same as the HVG arm) EVEN THOUGH
# ST's own input is 2560-d: the encoder never sees ST's input, only its
# gene-space target/output (docs/specs/2026-07-23-tx1-st-geneeffect-backbone
# -design.md Sec 6 Phase C correction -- see the Task 7 brief for the
# reasoning if this looks wrong).
#
# Both Phase C arms train on the SAME data: the frozen manifest's 4
# `train_response_and_head` lines (K562/HCT116/Jurkat/HepG2, C4/C5),
# assembled by `aivc_model.tx1_response_data.assemble_train_response_gene_bags`
# via `scripts/train_tx1_st_response.py --cache-dir/--line-manifest
# /--perturbseq-source-config`. This config's own `data:` section is NOT
# that data source (see below).

data:
  # Unused by this pipeline: scripts/train_tx1_st_response.py sources
  # training data via --cache-dir/--line-manifest/--perturbseq-source-config,
  # never via AivcConfig.data. `output_dir` (run-dir default base) and
  # `response_max_cells_per_gene` (below) are the two values this pipeline
  # actually reads from this section; every other key here is populated only
  # because DataConfig requires it.
  h5ad_path: UNUSED
  overlap_csv: UNUSED
  output_dir: results/experiments/12_tx1_st_geneeffect/phase_c
  # Documentary only in this pipeline (assemble_train_response_gene_bags
  # never reads config.data.state_embed_key -- it reads the Tx1 embedding
  # cache directly via --cache-dir), but named explicitly so the obsm-input
  # decision is auditable rather than an unlabeled 2560-d array.
  state_embed_key: X_tx1_3b
  # Fix-round-2 Defect 2: per-gene cell cap for the observed-response
  # builders (previously UNCAPPED -- build_perturbseq_response_adata had no
  # limit at all, so it could pull ~1.9M rows of a dense, unchunked h5ad
  # into memory for a single perturbed gene's cell set). ST trains on cell
  # sets of train.cell_set_len (64 in this config), so a few hundred
  # response cells per gene is already ample. Set explicitly here (matching
  # DataConfig's own bounded default) rather than left to that default so
  # the choice is visible in this file, not implicit.
  response_max_cells_per_gene: 256

split:
  # Phase C's GeneBags carry no GeneEffect label (`y` is an all-NaN
  # placeholder -- ST supervises on observed *expression*, not GeneEffect;
  # see loss: below), so this is a plain non-stratified gene-name split,
  # not exp05's label-stratified canonical CV split.
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  random_state: 42

state:
  backend: state_checkpoint
  model_dir: model/checkpoints/state/ST-HVG-Replogle/fewshot/k562
  checkpoint_path: model/checkpoints/state/ST-HVG-Replogle/fewshot/k562/checkpoints/final.ckpt
  # No released ST checkpoint takes a 2560-d Tx1 input, so this arm cannot
  # hot-start from an existing input layer (spec Sec 2.2): warm_start_from
  # points at the SAME checkpoint, but state_warm_start.py's shape-filtered
  # loader (Task 4) gives `basal_encoder.0` a fresh 2560-wide projection
  # while warm-starting every other (shape-matching) transformer weight.
  warm_start_from: model/checkpoints/state/ST-HVG-Replogle/fewshot/k562/checkpoints/final.ckpt
  input_dim: 2560
  output_dim: 2000
  pert_dim: 2024
  known_perturbation_vectors: model/checkpoints/state/ST-HVG-Replogle/fewshot/k562/pert_onehot_map.pt
  gene_tokenizer: state_onehot
  representation_layer: output
  # This IS the input-view decision: ST's input is the obsm Tx1 embedding,
  # distinct from the response-encoder's gene-space target.
  input_view: obsm
  # Matches the checkpoint's own saved output_space (verified locally); set
  # explicitly rather than left implicit so both arms record the same
  # audited decision (output_space=gene in both arms -- C9). Also guards
  # the warm-start path: state_warm_start.build_warm_started_state_model
  # only overrides the reference checkpoint's saved output_space when this
  # is non-null, and the reference checkpoint already IS "gene", so this is
  # a same-value (non-shape-affecting) override.
  output_space: gene
  # C7: Phase B measured Tx1 embeddings as NOT unit-norm
  # (fraction_unit_norm == 0.0, mean L2 == 63.6). Recorded explicitly at its
  # default (use the embeddings as Tx1 emits them) so the choice is visible
  # and auditable rather than an implicit assumption either way.
  l2_normalize_input: false

response_encoder:
  # Target-space, not ST-input-space: stays 2000 even though state.input_dim
  # is 2560 above. See this file's header comment.
  input_dim: 2000
  latent_dim: 128

gmm:
  n_components: 32
  covariance_floor: 0.0001
  init_scale: 0.02
  trainable: true

model:
  c_hidden_units: [64, 32]
  dropout: 0.1

loss:
  # Phase C trains ST's response prediction only (spec Sec 6 Phase C exit:
  # "ST checkpoints"); the GeneEffect head/GMM pooler are Phase D's job, and
  # these GeneBags carry no GeneEffect label (`y` is all-NaN). pred_c/obs_c
  # MUST stay 0: F.mse_loss(*, NaN) is NaN regardless of its weight
  # (0.0 * NaN == NaN in IEEE754), so a nonzero default here would poison
  # total_loss even though model.py's _weighted_loss_sum skips
  # exactly-zero-weighted terms. occupancy/gmm_nll do not depend on `y` but
  # are zeroed too since Phase C does not fit the pooler/head. hvg_* /
  # latent_* stay gene/output-space quantities in this arm too (C9): ST's
  # output is gene space in both arms, only its input differs.
  latent_mean_delta_weight: 1.0
  latent_energy_weight: 1.0
  hvg_mean_delta_weight: 0.1
  hvg_energy_weight: 0.1
  pred_c_weight: 0.0
  obs_c_weight: 0.0
  occupancy_weight: 0.0
  gmm_nll_weight: 0.0
  pred_rank_weight: 0.0

train:
  run_id: tx1_st_geneeffect_phase_c_tx1_arm
  seed: 42
  max_epochs: 20
  learning_rate: 0.000025
  state_learning_rate: 0.0000025
  weight_decay: 0.0001
  max_grad_norm: 1.0
  # Must equal the checkpoint's own cell_sentence_len (its config.yaml:
  # model.kwargs.cell_set_len == transformer_backbone_kwargs
  # .max_position_embeddings == 64); StateForwardAdapter.forward_chunks
  # rejects any other chunk size for a warm-started/loaded checkpoint.
  cell_set_len: 64
  # Kept at the default (1) as a conservative choice for this wave: this
  # is the first time the assembled two-view path has run at all, and
  # gene_batch_size > 1 routes through model.py::_forward_gene_batch, a
  # separate code path this wave's tests never exercise (all-NaN `y` is
  # confirmed NaN-safe there too -- _pairwise_ranknet_loss early-returns a
  # real zero when every label-delta comparison is False under NaN -- but
  # that path's *other* per-gene-batch behavior with this data shape is
  # untested). Raise once a follow-up task verifies the batched path
  # end to end; {1, 2, 4} are all otherwise legal per
  # train._require_authoritative_gene_batch_size.
  gene_batch_size: 1
  eval_control_panel_size: 4096
  eval_window_macro_batch_size: 64
  required_world_size: 4
  device: auto
  float32_matmul_precision: high
