# Exp13 Stage 1 pre-registered config.
#
# Satisfies docs/specs/2026-08-17-exp13-geneeffect-residual-protocol.md §7:
# per-anchor response metrics, held-out genes and four-line objective weights
# are pinned here before Stage 1 trains.
# Loaded by src/aivc_model/stage1_config.py::load_stage1_config, which raises
# on any unknown or missing key.

train:
  max_epochs: 50
  patience: 5
  learning_rate: 0.0001
  weight_decay: 0.01
  max_bag: 128
  gene_batch_size: 32
  validation_gene_batch_size: 64
  grad_clip: 1.0
  train_seed: 20260818
  collator_seed: 20260818
  data_seed: 42
  heldout_seed: 13
  heldout_fraction: 0.1
  log_every: 50
  float32_matmul_precision: high
  ddp_static_graph: true
  ddp_find_unused_parameters: false
  max_cells_per_gene: 128
  total_cells_per_line: null
  pert_dim: 2024
  max_esm2_drop_fraction: 0.10
  w_mean_delta: 1.0
  w_energy: 1.0

objective:
  # The four Perturb-seq anchors (03-experiment-protocol.md §3.2), equal-weighted.
  # ACH ids from configs/experiments/13_geneeffect_226/perturbseq_sources.json.
  anchor_weights:
    ACH-000551: 0.25 # K562 (Replogle GWPS)
    ACH-000995: 0.25 # Jurkat (Nadig 2025)
    ACH-000739: 0.25 # HepG2 (Nadig 2025)
    ACH-000971: 0.25 # HCT116 (X-Atlas-Orion)
  required_anchor_metrics: [mean_delta_mse, energy_distance]
