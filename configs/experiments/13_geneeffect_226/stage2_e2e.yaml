# Exp13 Stage 2 frozen full-model configuration. Every key is required.

seeds:
  train: 20260828
  collator: 20260828
  projection: 20260828

features:
  delta_proj_dim: 256
  summary_dim: 6
  q_sc_dim: 3
  esm2_dim: 1280
  context_dim: 5120
  cells_per_context: 128
  cell_set_len: 64
  standardizer_fit_split: train

loss:
  huber_delta: 1.0
  beta: 1.0
  g_var_percentile: 0.75
  minimum_observations: 5

warmup:
  optimizer: AdamW
  learning_rate: 0.001
  max_epochs: 100
  patience: 10
  hidden_dim: 256
  num_layers: 2

joint:
  conditions_per_rank: 256
  genes_per_batch: 8
  contexts_per_gene: 32
  response_batch_size: 64
  state_learning_rate: 0.000001
  esm_adapter_learning_rate: 0.00001
  head_learning_rate: 0.0001
  weight_decay: 0.01
  grad_clip: 1.0
  max_epochs: 10
  patience: 2

distributed:
  world_size: 4
  mixed_precision: bf16

lambda_calibration:
  train_batches: 8
  statistic: median_gradient_norm_ratio
  clip_min: 0.001
  clip_max: 1000.0

selection:
  metric: validation_macro_per_gene_spearman
  direction: maximize
  record_response_metrics: true
  response_hard_guard: false

run_scope:
  model: full
  num_seeds: 1
  ablations: []

paths:
  split: configs/benchmarks/cell_line_geneeffect_226_split.json
  gene_effect: data/sl_dependency_v0/raw/depmap/CRISPRGeneEffect.csv
  copy_prior: data/sl_dependency_v0/processed/exp13_copy_prior.csv  # not yet materialized
  copy_prior_manifest: data/sl_dependency_v0/processed/exp13_copy_prior_manifest.json  # not yet materialized
  source_registry: configs/experiments/13_geneeffect_226/basal_source_registry.csv
  tx1_registration: results/phase_a_tx1_20260724/phase_a_registration.json
  tx1_cache: data/tx1_basal_embeddings/v1
  q_sc_cache: results/experiments/13_geneeffect_226/q_sc_cache
  stage1_manifest: results/experiments/13_geneeffect_226/stage1_response_formal_20260820T1257Z_b256/stage1_model_manifest.json
  stage1_checkpoint: results/experiments/13_geneeffect_226/stage1_response_formal_20260820T1257Z_b256/best/pytorch_model.bin
  stage1_config: configs/experiments/13_geneeffect_226/stage1_response.yaml
  stage1_esm_embeddings: data/esm2/exp13_anchor_union_esm2_650M.npz
  esm2_embeddings: data/esm2/exp13_gene_universe_esm2_650M.npz
  esm2_universe_manifest: data/esm2/exp13_gene_universe_manifest.json
  esm2_provenance_manifest: data/esm2/exp13_gene_universe_esm2_650M.npz.provenance.json
  esm2_uniprot_mapping_json: data/esm2/exp13_gene_universe_esm2_650M.npz.uniprot_mapping.json
  esm2_uniprot_mapping_csv: data/esm2/exp13_gene_universe_esm2_650M.npz.uniprot_mapping.csv
  state_hparams: model/checkpoints/state/ST-HVG-Replogle/fewshot/k562/checkpoints/final.ckpt
  state_model_dir: model/checkpoints/state/ST-HVG-Replogle/fewshot/k562
  cell_line_manifest: results/phase_a_tx1_20260724/cell_line_manifest.csv
  perturbseq_sources: configs/experiments/13_geneeffect_226/perturbseq_sources.json
  response_cache: data/exp13_response_cache/v1
  output_root: results/experiments/13_geneeffect_226/stage2
