# Baselines on the multi-study SL benchmark (docs/specs/2026-10-29-multi-study-sl-benchmark-design.md):
# pair identity, pan-essentiality, stage one's prediction of GeneEffect (the SL backbone's reader, fitted on
# the SL split's training side, `hpc/run.sh sl-conditional`), the backbone's scores, and the measured
# GeneEffect as a reference (lines with GeneEffect only). Headline: recall in the top 10% of each genetic screen, mean over a study's screens,
# a line's studies and the lines; reported on validation and test for all
# lines, the lines with and without GeneEffect, and the cancer and non-cancer lines.
# `hpc/run.sh sl-baselines configs/sl/benchmark_baselines.yaml --run-id ID` (CPU), after the
# backbone, the KG4SL and Cilantro-SL runs and the five baselines below (hpc/README.md).
kind: sl_benchmark_baselines
seed: 0
output_root: outputs/sl
task: benchmark_baselines
labels: data/sl_studies/benchmark_v2/labels.parquet
split: configs/benchmarks/cell_line_sl_split.json
gene_effect: data/sl_dependency_v0/raw/depmap/CRISPRGeneEffect.csv
model: data/sl_dependency_v0/raw/depmap/Model.csv
stage_one: outputs/sl/conditional/conditional_seed0/predictions.parquet
# scores per (gene_a, gene_b), or per (model_id, gene_a, gene_b), made by other harnesses:
# KG4SL hpc/kg4sl/train.py; Cilantro-SL hpc/cilantro/run.sh RUN_ID --dictionary gc95M --benchmark;
# the backbone hpc/run.sh sl-conditional
extra_scores:
  kg4sl: outputs/sl/kg4sl/seed0/scores.parquet
  cilantro_sl: outputs/cilantro_reproduction/benchmark_gc95M/benchmark/scores.parquet
  conditional: outputs/sl/conditional/conditional_seed0/scores/conditional.parquet
  conditional_ablated: outputs/sl/conditional/conditional_seed0/scores/conditional_ablated.parquet
  head: outputs/sl/conditional/conditional_seed0/scores/head.parquet
  head_ablated: outputs/sl/conditional/conditional_seed0/scores/head_ablated.parquet
  # the backbone with the buffer-aware reader (configs/sl/conditional_buffer.yaml); its tables
  # carry the partner column of the partner-pair subset
  buffer_conditional: outputs/sl/conditional/conditional_buffer_seed0/scores/conditional.parquet
  buffer_conditional_ablated: outputs/sl/conditional/conditional_buffer_seed0/scores/conditional_ablated.parquet
  buffer_head: outputs/sl/conditional/conditional_buffer_seed0/scores/head.parquet
  buffer_head_ablated: outputs/sl/conditional/conditional_buffer_seed0/scores/head_ablated.parquet
  # PARIS hpc/run.sh sl-paris configs/sl/paris_benchmark.yaml (--shard, then --merge);
  # SLIdR hpc/run.sh sl-slidr configs/sl/slidr.yaml; De Kegel hpc/paralog/dekegel_scores.py;
  # Kebabci hpc/paralog/kebabci.py (measured, and --held-gene-effect); MiT4SL hpc/mit4sl/train.py
  paris: outputs/sl/paris_benchmark/seed0/scores.parquet
  slidr: outputs/sl/slidr/seed0/scores.parquet
  dekegel_paralog: outputs/sl/dekegel/scores.parquet
  kebabci_paralog: outputs/sl/kebabci/seed0/scores.parquet
  kebabci_paralog_predicted: outputs/sl/kebabci/predicted_seed0/scores.parquet
  mit4sl: outputs/sl/mit4sl/seed0/scores.parquet
top_k: 20
bootstrap: 1000
# (scorer, control): the per-line difference in recall in the top 10% with the line bootstrap
paired_differences:
  - [buffer_conditional, buffer_conditional_ablated]
  - [buffer_head, buffer_head_ablated]
  - [conditional, conditional_ablated]
  - [head, head_ablated]
