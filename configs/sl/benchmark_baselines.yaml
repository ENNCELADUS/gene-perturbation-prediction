# Baselines on the multi-study SL benchmark (docs/specs/2026-10-29-multi-study-sl-benchmark-design.md):
# pair identity, pan-essentiality, the default prior refitted on the SL split (A-blind, predicted
# GeneEffect in the line) and the measured GeneEffect as a reference, scored per (study, line) list.
# `hpc/run.sh sl-baselines configs/sl/benchmark_baselines.yaml --run-id ID` (CPU), after the prior export.
kind: sl_benchmark_baselines
seed: 0
output_root: outputs/sl
task: benchmark_baselines
labels: data/sl_studies/benchmark/labels.parquet
split: configs/benchmarks/cell_line_sl_split.json
gene_effect: data/sl_dependency_v0/raw/depmap/CRISPRGeneEffect.csv
prior: outputs/context_prior/default_prior_sl_split_seed0/export
top_k: 20
bootstrap: 1000
