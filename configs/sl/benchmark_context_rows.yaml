# The rows of SL protocol §21 beside the cross-line study of §20 (configs/sl/benchmark_cross_line.yaml, whose
# tables this config keeps) and the published baselines: the wide row on the v2 gene-in-line caches
# (cross_line_wide_v2), then that row with the bulk-RNA training lines (cross_line_80_lines), with the wide mean
# token (cross_line_wide_token) and with the pair-in-line features (cross_line_pair_in_line). Each run: `hpc/run.sh sl-embedding configs/sl/<config>.yaml --run-id <config>_seed0`.
# The harness reads the split's 44 training lines alone: for the run with the bulk-RNA training lines, a held-out pair
# that only those lines hold is a new pair here (the run's results.md gives the count).
# Every run is the `<config>_seed0_select` rerun, whose phase follows the selection rule of SL protocol §8 (2026-11-26).
# `hpc/run.sh sl-baselines configs/sl/benchmark_context_rows.yaml --run-id benchmark_context_rows_seed0_select` (CPU).
kind: sl_benchmark_baselines
seed: 0
output_root: outputs/sl
task: benchmark_baselines
labels: data/sl_studies/benchmark_v2/labels.parquet
split: configs/benchmarks/cell_line_sl_split.json
gene_effect: data/sl_dependency_v0/raw/depmap/CRISPRGeneEffect.csv
model: data/sl_dependency_v0/raw/depmap/Model.csv
# the linear expression model's GeneEffect, as in configs/sl/benchmark_baselines.yaml: it also sets
# the genes of the scored rows (the model's own stage-one numbers are in its results.md)
stage_one: outputs/sl/conditional/conditional_buffer_seed0/predictions.parquet
extra_scores:
  # the reference: the finished run without cell tokens (SL protocol §19), its model, its line-input controls,
  # its score with the line term and that score read in four other lines
  direct_mean_token: outputs/sl/embedding/embedding_direct_mean_token_seed0_select/scores/embedding.parquet
  direct_mean_token_mean_input: outputs/sl/embedding/embedding_direct_mean_token_seed0_select/scores/embedding_mean_input.parquet
  direct_mean_token_line_term: outputs/sl/embedding/embedding_direct_mean_token_seed0_select/scores/embedding_line_term.parquet
  direct_mean_token_line_term_other_line: outputs/sl/embedding/embedding_direct_mean_token_seed0_select/scores/embedding_line_term_other_line.parquet
  direct_mean_token_line_term_other_line_2: outputs/sl/embedding/embedding_direct_mean_token_seed0_select/scores/embedding_line_term_other_line_2.parquet
  direct_mean_token_line_term_other_line_3: outputs/sl/embedding/embedding_direct_mean_token_seed0_select/scores/embedding_line_term_other_line_3.parquet
  direct_mean_token_line_term_other_line_4: outputs/sl/embedding/embedding_direct_mean_token_seed0_select/scores/embedding_line_term_other_line_4.parquet
  # the model with Tx1-3B cell tokens and the line term on own expression and PIE change (SL protocol §19)
  direct_pie_change_line_term: outputs/sl/embedding/embedding_direct_pie_change_seed0_select/scores/embedding_line_term.parquet
  # each run of the study: the score with the line term, the pair head alone, the model on the mean input, and
  # the score with the line term read in each of four other lines
  cross_frozen: outputs/sl/embedding/cross_line_frozen_seed0_select/scores/embedding_line_term.parquet
  cross_frozen_model: outputs/sl/embedding/cross_line_frozen_seed0_select/scores/embedding.parquet
  cross_frozen_mean_input: outputs/sl/embedding/cross_line_frozen_seed0_select/scores/embedding_mean_input.parquet
  cross_frozen_other_line_1: outputs/sl/embedding/cross_line_frozen_seed0_select/scores/embedding_line_term_other_line.parquet
  cross_frozen_other_line_2: outputs/sl/embedding/cross_line_frozen_seed0_select/scores/embedding_line_term_other_line_2.parquet
  cross_frozen_other_line_3: outputs/sl/embedding/cross_line_frozen_seed0_select/scores/embedding_line_term_other_line_3.parquet
  cross_frozen_other_line_4: outputs/sl/embedding/cross_line_frozen_seed0_select/scores/embedding_line_term_other_line_4.parquet
  cross_joint: outputs/sl/embedding/cross_line_joint_seed0_select/scores/embedding_line_term.parquet
  cross_joint_model: outputs/sl/embedding/cross_line_joint_seed0_select/scores/embedding.parquet
  cross_joint_mean_input: outputs/sl/embedding/cross_line_joint_seed0_select/scores/embedding_mean_input.parquet
  cross_joint_other_line_1: outputs/sl/embedding/cross_line_joint_seed0_select/scores/embedding_line_term_other_line.parquet
  cross_joint_other_line_2: outputs/sl/embedding/cross_line_joint_seed0_select/scores/embedding_line_term_other_line_2.parquet
  cross_joint_other_line_3: outputs/sl/embedding/cross_line_joint_seed0_select/scores/embedding_line_term_other_line_3.parquet
  cross_joint_other_line_4: outputs/sl/embedding/cross_line_joint_seed0_select/scores/embedding_line_term_other_line_4.parquet
  cross_genes_input: outputs/sl/embedding/cross_line_genes_input_seed0_select/scores/embedding_line_term.parquet
  cross_genes_input_model: outputs/sl/embedding/cross_line_genes_input_seed0_select/scores/embedding.parquet
  cross_genes_input_mean_input: outputs/sl/embedding/cross_line_genes_input_seed0_select/scores/embedding_mean_input.parquet
  cross_genes_input_other_line_1: outputs/sl/embedding/cross_line_genes_input_seed0_select/scores/embedding_line_term_other_line.parquet
  cross_genes_input_other_line_2: outputs/sl/embedding/cross_line_genes_input_seed0_select/scores/embedding_line_term_other_line_2.parquet
  cross_genes_input_other_line_3: outputs/sl/embedding/cross_line_genes_input_seed0_select/scores/embedding_line_term_other_line_3.parquet
  cross_genes_input_other_line_4: outputs/sl/embedding/cross_line_genes_input_seed0_select/scores/embedding_line_term_other_line_4.parquet
  cross_wide: outputs/sl/embedding/cross_line_wide_seed0_select/scores/embedding_line_term.parquet
  cross_wide_model: outputs/sl/embedding/cross_line_wide_seed0_select/scores/embedding.parquet
  cross_wide_mean_input: outputs/sl/embedding/cross_line_wide_seed0_select/scores/embedding_mean_input.parquet
  cross_wide_other_line_1: outputs/sl/embedding/cross_line_wide_seed0_select/scores/embedding_line_term_other_line.parquet
  cross_wide_other_line_2: outputs/sl/embedding/cross_line_wide_seed0_select/scores/embedding_line_term_other_line_2.parquet
  cross_wide_other_line_3: outputs/sl/embedding/cross_line_wide_seed0_select/scores/embedding_line_term_other_line_3.parquet
  cross_wide_other_line_4: outputs/sl/embedding/cross_line_wide_seed0_select/scores/embedding_line_term_other_line_4.parquet
  cross_depmap_dna: outputs/sl/embedding/cross_line_depmap_dna_seed0_select/scores/embedding_line_term.parquet
  cross_depmap_dna_model: outputs/sl/embedding/cross_line_depmap_dna_seed0_select/scores/embedding.parquet
  cross_depmap_dna_mean_input: outputs/sl/embedding/cross_line_depmap_dna_seed0_select/scores/embedding_mean_input.parquet
  cross_depmap_dna_other_line_1: outputs/sl/embedding/cross_line_depmap_dna_seed0_select/scores/embedding_line_term_other_line.parquet
  cross_depmap_dna_other_line_2: outputs/sl/embedding/cross_line_depmap_dna_seed0_select/scores/embedding_line_term_other_line_2.parquet
  cross_depmap_dna_other_line_3: outputs/sl/embedding/cross_line_depmap_dna_seed0_select/scores/embedding_line_term_other_line_3.parquet
  cross_depmap_dna_other_line_4: outputs/sl/embedding/cross_line_depmap_dna_seed0_select/scores/embedding_line_term_other_line_4.parquet
  # the rows of SL protocol §21: the wide row on the v2 caches, then that row with one change each (the bulk-RNA
  # training lines, the wide mean token, the pair-in-line features)
  cross_wide_v2: outputs/sl/embedding/cross_line_wide_v2_seed0_select/scores/embedding_line_term.parquet
  cross_wide_v2_model: outputs/sl/embedding/cross_line_wide_v2_seed0_select/scores/embedding.parquet
  cross_wide_v2_mean_input: outputs/sl/embedding/cross_line_wide_v2_seed0_select/scores/embedding_mean_input.parquet
  cross_wide_v2_other_line_1: outputs/sl/embedding/cross_line_wide_v2_seed0_select/scores/embedding_line_term_other_line.parquet
  cross_wide_v2_other_line_2: outputs/sl/embedding/cross_line_wide_v2_seed0_select/scores/embedding_line_term_other_line_2.parquet
  cross_wide_v2_other_line_3: outputs/sl/embedding/cross_line_wide_v2_seed0_select/scores/embedding_line_term_other_line_3.parquet
  cross_wide_v2_other_line_4: outputs/sl/embedding/cross_line_wide_v2_seed0_select/scores/embedding_line_term_other_line_4.parquet
  cross_80_lines: outputs/sl/embedding/cross_line_80_lines_seed0_select/scores/embedding_line_term.parquet
  cross_80_lines_model: outputs/sl/embedding/cross_line_80_lines_seed0_select/scores/embedding.parquet
  cross_80_lines_mean_input: outputs/sl/embedding/cross_line_80_lines_seed0_select/scores/embedding_mean_input.parquet
  cross_80_lines_other_line_1: outputs/sl/embedding/cross_line_80_lines_seed0_select/scores/embedding_line_term_other_line.parquet
  cross_80_lines_other_line_2: outputs/sl/embedding/cross_line_80_lines_seed0_select/scores/embedding_line_term_other_line_2.parquet
  cross_80_lines_other_line_3: outputs/sl/embedding/cross_line_80_lines_seed0_select/scores/embedding_line_term_other_line_3.parquet
  cross_80_lines_other_line_4: outputs/sl/embedding/cross_line_80_lines_seed0_select/scores/embedding_line_term_other_line_4.parquet
  cross_wide_token: outputs/sl/embedding/cross_line_wide_token_seed0_select/scores/embedding_line_term.parquet
  cross_wide_token_model: outputs/sl/embedding/cross_line_wide_token_seed0_select/scores/embedding.parquet
  cross_wide_token_mean_input: outputs/sl/embedding/cross_line_wide_token_seed0_select/scores/embedding_mean_input.parquet
  cross_wide_token_other_line_1: outputs/sl/embedding/cross_line_wide_token_seed0_select/scores/embedding_line_term_other_line.parquet
  cross_wide_token_other_line_2: outputs/sl/embedding/cross_line_wide_token_seed0_select/scores/embedding_line_term_other_line_2.parquet
  cross_wide_token_other_line_3: outputs/sl/embedding/cross_line_wide_token_seed0_select/scores/embedding_line_term_other_line_3.parquet
  cross_wide_token_other_line_4: outputs/sl/embedding/cross_line_wide_token_seed0_select/scores/embedding_line_term_other_line_4.parquet
  cross_pair_in_line: outputs/sl/embedding/cross_line_pair_in_line_seed0_select/scores/embedding_line_term.parquet
  cross_pair_in_line_model: outputs/sl/embedding/cross_line_pair_in_line_seed0_select/scores/embedding.parquet
  cross_pair_in_line_mean_input: outputs/sl/embedding/cross_line_pair_in_line_seed0_select/scores/embedding_mean_input.parquet
  cross_pair_in_line_other_line_1: outputs/sl/embedding/cross_line_pair_in_line_seed0_select/scores/embedding_line_term_other_line.parquet
  cross_pair_in_line_other_line_2: outputs/sl/embedding/cross_line_pair_in_line_seed0_select/scores/embedding_line_term_other_line_2.parquet
  cross_pair_in_line_other_line_3: outputs/sl/embedding/cross_line_pair_in_line_seed0_select/scores/embedding_line_term_other_line_3.parquet
  cross_pair_in_line_other_line_4: outputs/sl/embedding/cross_line_pair_in_line_seed0_select/scores/embedding_line_term_other_line_4.parquet
  buffer_head: outputs/sl/conditional/conditional_buffer_seed0/scores/head.parquet
  kg4sl: outputs/sl/kg4sl/seed0/scores.parquet
  cilantro_sl: outputs/cilantro_reproduction/benchmark_gc95M/benchmark/scores.parquet
  paris: outputs/sl/paris_benchmark/seed0/scores.parquet
  slidr: outputs/sl/slidr/seed0/scores.parquet
  dekegel_paralog: outputs/sl/dekegel/scores.parquet
  kebabci_paralog: outputs/sl/kebabci/seed0/scores.parquet
  kebabci_paralog_predicted: outputs/sl/kebabci/predicted_seed0/scores.parquet
  mit4sl: outputs/sl/mit4sl/seed0/scores.parquet
top_k: 20
bootstrap: 1000
# a derived scorer: the mean over its scorers of each line's metrics (the other-line control over four lines)
scorer_means:
  direct_mean_token_line_term_other_lines: [direct_mean_token_line_term_other_line, direct_mean_token_line_term_other_line_2, direct_mean_token_line_term_other_line_3, direct_mean_token_line_term_other_line_4]
  cross_frozen_other_lines: [cross_frozen_other_line_1, cross_frozen_other_line_2, cross_frozen_other_line_3, cross_frozen_other_line_4]
  cross_joint_other_lines: [cross_joint_other_line_1, cross_joint_other_line_2, cross_joint_other_line_3, cross_joint_other_line_4]
  cross_genes_input_other_lines: [cross_genes_input_other_line_1, cross_genes_input_other_line_2, cross_genes_input_other_line_3, cross_genes_input_other_line_4]
  cross_wide_other_lines: [cross_wide_other_line_1, cross_wide_other_line_2, cross_wide_other_line_3, cross_wide_other_line_4]
  cross_depmap_dna_other_lines: [cross_depmap_dna_other_line_1, cross_depmap_dna_other_line_2, cross_depmap_dna_other_line_3, cross_depmap_dna_other_line_4]
  cross_wide_v2_other_lines: [cross_wide_v2_other_line_1, cross_wide_v2_other_line_2, cross_wide_v2_other_line_3, cross_wide_v2_other_line_4]
  cross_80_lines_other_lines: [cross_80_lines_other_line_1, cross_80_lines_other_line_2, cross_80_lines_other_line_3, cross_80_lines_other_line_4]
  cross_wide_token_other_lines: [cross_wide_token_other_line_1, cross_wide_token_other_line_2, cross_wide_token_other_line_3, cross_wide_token_other_line_4]
  cross_pair_in_line_other_lines: [cross_pair_in_line_other_line_1, cross_pair_in_line_other_line_2, cross_pair_in_line_other_line_3, cross_pair_in_line_other_line_4]
# scorers with the cross-line ordering: the labels (its example counts), each score, each score on another line's
# input, then every other row of the report (a score without the line gives 0.5)
cross_line_ordering:
  - labels
  - direct_mean_token_line_term
  - direct_mean_token_line_term_other_line
  - cross_frozen
  - cross_frozen_other_line_1
  - cross_joint
  - cross_joint_other_line_1
  - cross_genes_input
  - cross_genes_input_other_line_1
  - cross_wide
  - cross_wide_other_line_1
  - cross_depmap_dna
  - cross_depmap_dna_other_line_1
  - cross_wide_v2
  - cross_wide_v2_other_line_1
  - cross_80_lines
  - cross_80_lines_other_line_1
  - cross_wide_token
  - cross_wide_token_other_line_1
  - cross_pair_in_line
  - cross_pair_in_line_other_line_1
  - direct_mean_token
  - direct_pie_change_line_term
  - buffer_head
  - stage_one
  - pan_essentiality
  - measured_geneeffect
  - random
  - kg4sl
  - cilantro_sl
  - paris
  - slidr
  - dekegel_paralog
  - kebabci_paralog
  - kebabci_paralog_predicted
  - mit4sl
# (scorer, control): the per-line difference in recall in the top 10% with the line bootstrap
paired_differences:
  # the line's gain: the score minus itself on other lines' input, and minus the model on the mean input
  - [direct_mean_token_line_term, direct_mean_token_line_term_other_lines]
  - [direct_mean_token_line_term, direct_mean_token_mean_input]
  - [cross_frozen, cross_frozen_other_lines]
  - [cross_frozen, cross_frozen_mean_input]
  - [cross_joint, cross_joint_other_lines]
  - [cross_joint, cross_joint_mean_input]
  - [cross_genes_input, cross_genes_input_other_lines]
  - [cross_genes_input, cross_genes_input_mean_input]
  - [cross_wide, cross_wide_other_lines]
  - [cross_wide, cross_wide_mean_input]
  - [cross_depmap_dna, cross_depmap_dna_other_lines]
  - [cross_depmap_dna, cross_depmap_dna_mean_input]
  - [cross_wide_v2, cross_wide_v2_other_lines]
  - [cross_wide_v2, cross_wide_v2_mean_input]
  - [cross_80_lines, cross_80_lines_other_lines]
  - [cross_80_lines, cross_80_lines_mean_input]
  - [cross_wide_token, cross_wide_token_other_lines]
  - [cross_wide_token, cross_wide_token_mean_input]
  - [cross_pair_in_line, cross_pair_in_line_other_lines]
  - [cross_pair_in_line, cross_pair_in_line_mean_input]
  # what the line term adds over the pair head alone
  - [cross_frozen, cross_frozen_model]
  - [cross_joint, cross_joint_model]
  - [cross_genes_input, cross_genes_input_model]
  - [cross_wide, cross_wide_model]
  - [cross_depmap_dna, cross_depmap_dna_model]
  - [cross_wide_v2, cross_wide_v2_model]
  - [cross_80_lines, cross_80_lines_model]
  - [cross_wide_token, cross_wide_token_model]
  - [cross_pair_in_line, cross_pair_in_line_model]
  # each row minus the row above it
  - [cross_frozen, direct_mean_token_line_term]
  - [cross_joint, cross_frozen]
  - [cross_genes_input, cross_joint]
  - [cross_wide, cross_genes_input]
  - [cross_depmap_dna, cross_wide]
  # the wide row on the v2 caches minus the wide row of §20, then each row of SL protocol §21 minus the v2 wide row
  - [cross_wide_v2, cross_wide]
  - [cross_80_lines, cross_wide_v2]
  - [cross_wide_token, cross_wide_v2]
  - [cross_pair_in_line, cross_wide_v2]
  # against Kebabci's paralog classifier on predicted GeneEffect
  - [cross_frozen, kebabci_paralog_predicted]
  - [cross_joint, kebabci_paralog_predicted]
  - [cross_genes_input, kebabci_paralog_predicted]
  - [cross_wide, kebabci_paralog_predicted]
  - [cross_depmap_dna, kebabci_paralog_predicted]
  - [cross_80_lines, kebabci_paralog_predicted]
  - [cross_wide_token, kebabci_paralog_predicted]
  - [cross_pair_in_line, kebabci_paralog_predicted]
  - [cross_wide_v2, kebabci_paralog_predicted]
