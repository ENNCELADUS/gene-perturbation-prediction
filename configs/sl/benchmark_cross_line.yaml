# The cross-line loss and the local gene-in-line data (SL protocol §20; design
# docs/specs/2026-11-24-context-specific-sl-architecture-design.md §5, §6; plan
# docs/specs/2026-11-24-cross-line-loss-plan.md) beside the finished run without cell tokens of SL protocol §19
# and the published baselines. The five runs are `hpc/run.sh sl-embedding configs/sl/<config>.yaml --run-id
# <config>_seed0` for cross_line_frozen, cross_line_joint, cross_line_genes_input, cross_line_wide and
# cross_line_depmap_dna. The reference run gets its four other-line controls from
# `hpc/run.sh sl-embedding configs/sl/embedding_direct_mean_token.yaml --run-id embedding_direct_mean_token_seed0_v2
# --line-input-controls`.
# `hpc/run.sh sl-baselines configs/sl/benchmark_cross_line.yaml --run-id benchmark_cross_line_seed0` (CPU).
kind: sl_benchmark_baselines
seed: 0
output_root: outputs/sl
task: benchmark_baselines
labels: data/sl_studies/benchmark_v2/labels.parquet
split: configs/benchmarks/cell_line_sl_split.json
gene_effect: data/sl_dependency_v0/raw/depmap/CRISPRGeneEffect.csv
model: data/sl_dependency_v0/raw/depmap/Model.csv
# the linear expression model's GeneEffect, as in configs/sl/benchmark_baselines.yaml: it also sets
# the genes of the scored rows (the model's own stage-one numbers are in its results.md)
stage_one: outputs/sl/conditional/conditional_buffer_seed0/predictions.parquet
extra_scores:
  # the reference: the finished run without cell tokens (SL protocol §19), its model, its line-input controls,
  # its score with the line term and that score read in four other lines
  direct_mean_token: outputs/sl/embedding/embedding_direct_mean_token_seed0_v2/scores/embedding.parquet
  direct_mean_token_mean_input: outputs/sl/embedding/embedding_direct_mean_token_seed0_v2/scores/embedding_mean_input.parquet
  direct_mean_token_line_term: outputs/sl/embedding/embedding_direct_mean_token_seed0_v2/scores/embedding_line_term.parquet
  direct_mean_token_line_term_other_line: outputs/sl/embedding/embedding_direct_mean_token_seed0_v2/scores/embedding_line_term_other_line.parquet
  direct_mean_token_line_term_other_line_2: outputs/sl/embedding/embedding_direct_mean_token_seed0_v2/scores/embedding_line_term_other_line_2.parquet
  direct_mean_token_line_term_other_line_3: outputs/sl/embedding/embedding_direct_mean_token_seed0_v2/scores/embedding_line_term_other_line_3.parquet
  direct_mean_token_line_term_other_line_4: outputs/sl/embedding/embedding_direct_mean_token_seed0_v2/scores/embedding_line_term_other_line_4.parquet
  # each run of the study: the score with the line term, the pair head alone, the model on the mean input, and
  # the score with the line term read in each of four other lines
  cross_frozen: outputs/sl/embedding/cross_line_frozen_seed0/scores/embedding_line_term.parquet
  cross_frozen_model: outputs/sl/embedding/cross_line_frozen_seed0/scores/embedding.parquet
  cross_frozen_mean_input: outputs/sl/embedding/cross_line_frozen_seed0/scores/embedding_mean_input.parquet
  cross_frozen_other_line_1: outputs/sl/embedding/cross_line_frozen_seed0/scores/embedding_line_term_other_line.parquet
  cross_frozen_other_line_2: outputs/sl/embedding/cross_line_frozen_seed0/scores/embedding_line_term_other_line_2.parquet
  cross_frozen_other_line_3: outputs/sl/embedding/cross_line_frozen_seed0/scores/embedding_line_term_other_line_3.parquet
  cross_frozen_other_line_4: outputs/sl/embedding/cross_line_frozen_seed0/scores/embedding_line_term_other_line_4.parquet
  cross_joint: outputs/sl/embedding/cross_line_joint_seed0/scores/embedding_line_term.parquet
  cross_joint_model: outputs/sl/embedding/cross_line_joint_seed0/scores/embedding.parquet
  cross_joint_mean_input: outputs/sl/embedding/cross_line_joint_seed0/scores/embedding_mean_input.parquet
  cross_joint_other_line_1: outputs/sl/embedding/cross_line_joint_seed0/scores/embedding_line_term_other_line.parquet
  cross_joint_other_line_2: outputs/sl/embedding/cross_line_joint_seed0/scores/embedding_line_term_other_line_2.parquet
  cross_joint_other_line_3: outputs/sl/embedding/cross_line_joint_seed0/scores/embedding_line_term_other_line_3.parquet
  cross_joint_other_line_4: outputs/sl/embedding/cross_line_joint_seed0/scores/embedding_line_term_other_line_4.parquet
  cross_genes_input: outputs/sl/embedding/cross_line_genes_input_seed0/scores/embedding_line_term.parquet
  cross_genes_input_model: outputs/sl/embedding/cross_line_genes_input_seed0/scores/embedding.parquet
  cross_genes_input_mean_input: outputs/sl/embedding/cross_line_genes_input_seed0/scores/embedding_mean_input.parquet
  cross_genes_input_other_line_1: outputs/sl/embedding/cross_line_genes_input_seed0/scores/embedding_line_term_other_line.parquet
  cross_genes_input_other_line_2: outputs/sl/embedding/cross_line_genes_input_seed0/scores/embedding_line_term_other_line_2.parquet
  cross_genes_input_other_line_3: outputs/sl/embedding/cross_line_genes_input_seed0/scores/embedding_line_term_other_line_3.parquet
  cross_genes_input_other_line_4: outputs/sl/embedding/cross_line_genes_input_seed0/scores/embedding_line_term_other_line_4.parquet
  cross_wide: outputs/sl/embedding/cross_line_wide_seed0/scores/embedding_line_term.parquet
  cross_wide_model: outputs/sl/embedding/cross_line_wide_seed0/scores/embedding.parquet
  cross_wide_mean_input: outputs/sl/embedding/cross_line_wide_seed0/scores/embedding_mean_input.parquet
  cross_wide_other_line_1: outputs/sl/embedding/cross_line_wide_seed0/scores/embedding_line_term_other_line.parquet
  cross_wide_other_line_2: outputs/sl/embedding/cross_line_wide_seed0/scores/embedding_line_term_other_line_2.parquet
  cross_wide_other_line_3: outputs/sl/embedding/cross_line_wide_seed0/scores/embedding_line_term_other_line_3.parquet
  cross_wide_other_line_4: outputs/sl/embedding/cross_line_wide_seed0/scores/embedding_line_term_other_line_4.parquet
  cross_depmap_dna: outputs/sl/embedding/cross_line_depmap_dna_seed0/scores/embedding_line_term.parquet
  cross_depmap_dna_model: outputs/sl/embedding/cross_line_depmap_dna_seed0/scores/embedding.parquet
  cross_depmap_dna_mean_input: outputs/sl/embedding/cross_line_depmap_dna_seed0/scores/embedding_mean_input.parquet
  cross_depmap_dna_other_line_1: outputs/sl/embedding/cross_line_depmap_dna_seed0/scores/embedding_line_term_other_line.parquet
  cross_depmap_dna_other_line_2: outputs/sl/embedding/cross_line_depmap_dna_seed0/scores/embedding_line_term_other_line_2.parquet
  cross_depmap_dna_other_line_3: outputs/sl/embedding/cross_line_depmap_dna_seed0/scores/embedding_line_term_other_line_3.parquet
  cross_depmap_dna_other_line_4: outputs/sl/embedding/cross_line_depmap_dna_seed0/scores/embedding_line_term_other_line_4.parquet
  buffer_head: outputs/sl/conditional/conditional_buffer_seed0/scores/head.parquet
  kg4sl: outputs/sl/kg4sl/seed0/scores.parquet
  cilantro_sl: outputs/cilantro_reproduction/benchmark_gc95M/benchmark/scores.parquet
  paris: outputs/sl/paris_benchmark/seed0/scores.parquet
  slidr: outputs/sl/slidr/seed0/scores.parquet
  dekegel_paralog: outputs/sl/dekegel/scores.parquet
  kebabci_paralog_predicted: outputs/sl/kebabci/predicted_seed0/scores.parquet
  mit4sl: outputs/sl/mit4sl/seed0/scores.parquet
top_k: 20
bootstrap: 1000
# a derived scorer: the mean over its scorers of each line's metrics (the other-line control over four lines)
scorer_means:
  direct_mean_token_line_term_other_lines: [direct_mean_token_line_term_other_line, direct_mean_token_line_term_other_line_2, direct_mean_token_line_term_other_line_3, direct_mean_token_line_term_other_line_4]
  cross_frozen_other_lines: [cross_frozen_other_line_1, cross_frozen_other_line_2, cross_frozen_other_line_3, cross_frozen_other_line_4]
  cross_joint_other_lines: [cross_joint_other_line_1, cross_joint_other_line_2, cross_joint_other_line_3, cross_joint_other_line_4]
  cross_genes_input_other_lines: [cross_genes_input_other_line_1, cross_genes_input_other_line_2, cross_genes_input_other_line_3, cross_genes_input_other_line_4]
  cross_wide_other_lines: [cross_wide_other_line_1, cross_wide_other_line_2, cross_wide_other_line_3, cross_wide_other_line_4]
  cross_depmap_dna_other_lines: [cross_depmap_dna_other_line_1, cross_depmap_dna_other_line_2, cross_depmap_dna_other_line_3, cross_depmap_dna_other_line_4]
# scorers with the cross-line ordering: the labels (its example counts), each score and each score on another line's input
cross_line_ordering:
  - labels
  - direct_mean_token_line_term
  - direct_mean_token_line_term_other_line
  - cross_frozen
  - cross_frozen_other_line_1
  - cross_joint
  - cross_joint_other_line_1
  - cross_genes_input
  - cross_genes_input_other_line_1
  - cross_wide
  - cross_wide_other_line_1
  - cross_depmap_dna
  - cross_depmap_dna_other_line_1
# (scorer, control): the per-line difference in recall in the top 10% with the line bootstrap
paired_differences:
  # the line's gain: the score minus itself on other lines' input, and minus the model on the mean input
  - [direct_mean_token_line_term, direct_mean_token_line_term_other_lines]
  - [direct_mean_token_line_term, direct_mean_token_mean_input]
  - [cross_frozen, cross_frozen_other_lines]
  - [cross_frozen, cross_frozen_mean_input]
  - [cross_joint, cross_joint_other_lines]
  - [cross_joint, cross_joint_mean_input]
  - [cross_genes_input, cross_genes_input_other_lines]
  - [cross_genes_input, cross_genes_input_mean_input]
  - [cross_wide, cross_wide_other_lines]
  - [cross_wide, cross_wide_mean_input]
  - [cross_depmap_dna, cross_depmap_dna_other_lines]
  - [cross_depmap_dna, cross_depmap_dna_mean_input]
  # what the line term adds over the pair head alone
  - [cross_frozen, cross_frozen_model]
  - [cross_joint, cross_joint_model]
  - [cross_genes_input, cross_genes_input_model]
  - [cross_wide, cross_wide_model]
  - [cross_depmap_dna, cross_depmap_dna_model]
  # each row minus the row above it
  - [cross_frozen, direct_mean_token_line_term]
  - [cross_joint, cross_frozen]
  - [cross_genes_input, cross_joint]
  - [cross_wide, cross_genes_input]
  - [cross_depmap_dna, cross_wide]
  # against Kebabci's paralog classifier on predicted GeneEffect
  - [cross_frozen, kebabci_paralog_predicted]
  - [cross_joint, kebabci_paralog_predicted]
  - [cross_genes_input, kebabci_paralog_predicted]
  - [cross_wide, kebabci_paralog_predicted]
  - [cross_depmap_dna, kebabci_paralog_predicted]
