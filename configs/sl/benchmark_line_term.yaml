# The direct GeneEffect target and the line term (SL protocol §19;
# docs/specs/2026-11-20-line-term-and-direct-target-plan.md) beside the finished runs of 2026-11-19 (residual
# target; their stage two started from the untrained model) and the published baselines. The four runs are
# `hpc/run.sh sl-embedding configs/sl/<config>.yaml --run-id <config>_seed0_v2` for embedding_direct,
# embedding_direct_mean_token, embedding_direct_pie_change and embedding_direct_tx1_gene.
# `hpc/run.sh sl-baselines configs/sl/benchmark_line_term.yaml --run-id benchmark_line_term_seed0_v2` (CPU).
kind: sl_benchmark_baselines
seed: 0
output_root: outputs/sl
task: benchmark_baselines
labels: data/sl_studies/benchmark_v2/labels.parquet
split: configs/benchmarks/cell_line_sl_split.json
gene_effect: data/sl_dependency_v0/raw/depmap/CRISPRGeneEffect.csv
model: data/sl_dependency_v0/raw/depmap/Model.csv
# the linear expression model's GeneEffect, as in configs/sl/benchmark_baselines.yaml: it also sets
# the genes of the scored rows (the model's own stage-one numbers are in its results.md)
stage_one: outputs/sl/conditional/conditional_buffer_seed0/predictions.parquet
extra_scores:
  embedding: outputs/sl/embedding/embedding_seed0/scores/embedding.parquet
  # the same weights with each line's input replaced (no refit): by the fit lines' mean, and by
  # another line's input; `hpc/run.sh sl-embedding <config> --run-id <id> --line-input-controls`
  # writes them for a run that finished before 2026-11-20
  embedding_mean_input: outputs/sl/embedding/embedding_seed0/scores/embedding_mean_input.parquet
  embedding_other_line: outputs/sl/embedding/embedding_seed0/scores/embedding_other_line.parquet
  # the same model with CellNet's cell embeddings (configs/sl/embedding_cellnet.yaml)
  embedding_cellnet: outputs/sl/embedding/embedding_cellnet_seed0/scores/embedding.parquet
  # the same model without its cell tokens (configs/sl/embedding_mean_token.yaml)
  embedding_mean_token: outputs/sl/embedding/embedding_mean_token_seed0/scores/embedding.parquet
  embedding_mean_token_mean_input: outputs/sl/embedding/embedding_mean_token_seed0/scores/embedding_mean_input.parquet
  embedding_mean_token_other_line: outputs/sl/embedding/embedding_mean_token_seed0/scores/embedding_other_line.parquet
  # the four runs of SL protocol §19: the model, its two line-input controls, the model with the line
  # term (s) and the model and the line term read in another line; run ids end in _seed0_v2 (the _seed0 runs
  # of 2026-11-20 added the line term to the pair score on the mean input)
  direct: outputs/sl/embedding/embedding_direct_seed0_v2/scores/embedding.parquet
  direct_mean_input: outputs/sl/embedding/embedding_direct_seed0_v2/scores/embedding_mean_input.parquet
  direct_other_line: outputs/sl/embedding/embedding_direct_seed0_v2/scores/embedding_other_line.parquet
  direct_line_term: outputs/sl/embedding/embedding_direct_seed0_v2/scores/embedding_line_term.parquet
  direct_line_term_other_line: outputs/sl/embedding/embedding_direct_seed0_v2/scores/embedding_line_term_other_line.parquet
  direct_mean_token: outputs/sl/embedding/embedding_direct_mean_token_seed0_v2/scores/embedding.parquet
  direct_mean_token_mean_input: outputs/sl/embedding/embedding_direct_mean_token_seed0_v2/scores/embedding_mean_input.parquet
  direct_mean_token_other_line: outputs/sl/embedding/embedding_direct_mean_token_seed0_v2/scores/embedding_other_line.parquet
  direct_mean_token_line_term: outputs/sl/embedding/embedding_direct_mean_token_seed0_v2/scores/embedding_line_term.parquet
  direct_mean_token_line_term_other_line: outputs/sl/embedding/embedding_direct_mean_token_seed0_v2/scores/embedding_line_term_other_line.parquet
  direct_pie_change: outputs/sl/embedding/embedding_direct_pie_change_seed0_v2/scores/embedding.parquet
  direct_pie_change_mean_input: outputs/sl/embedding/embedding_direct_pie_change_seed0_v2/scores/embedding_mean_input.parquet
  direct_pie_change_other_line: outputs/sl/embedding/embedding_direct_pie_change_seed0_v2/scores/embedding_other_line.parquet
  direct_pie_change_line_term: outputs/sl/embedding/embedding_direct_pie_change_seed0_v2/scores/embedding_line_term.parquet
  direct_pie_change_line_term_other_line: outputs/sl/embedding/embedding_direct_pie_change_seed0_v2/scores/embedding_line_term_other_line.parquet
  direct_tx1_gene: outputs/sl/embedding/embedding_direct_tx1_gene_seed0_v2/scores/embedding.parquet
  direct_tx1_gene_mean_input: outputs/sl/embedding/embedding_direct_tx1_gene_seed0_v2/scores/embedding_mean_input.parquet
  direct_tx1_gene_other_line: outputs/sl/embedding/embedding_direct_tx1_gene_seed0_v2/scores/embedding_other_line.parquet
  direct_tx1_gene_line_term: outputs/sl/embedding/embedding_direct_tx1_gene_seed0_v2/scores/embedding_line_term.parquet
  direct_tx1_gene_line_term_other_line: outputs/sl/embedding/embedding_direct_tx1_gene_seed0_v2/scores/embedding_line_term_other_line.parquet
  buffer_head: outputs/sl/conditional/conditional_buffer_seed0/scores/head.parquet
  buffer_head_ablated: outputs/sl/conditional/conditional_buffer_seed0/scores/head_ablated.parquet
  kg4sl: outputs/sl/kg4sl/seed0/scores.parquet
  cilantro_sl: outputs/cilantro_reproduction/benchmark_gc95M/benchmark/scores.parquet
  paris: outputs/sl/paris_benchmark/seed0/scores.parquet
  slidr: outputs/sl/slidr/seed0/scores.parquet
  dekegel_paralog: outputs/sl/dekegel/scores.parquet
  kebabci_paralog_predicted: outputs/sl/kebabci/predicted_seed0/scores.parquet
  mit4sl: outputs/sl/mit4sl/seed0/scores.parquet
top_k: 20
bootstrap: 1000
# (scorer, control): the per-line difference in recall in the top 10% with the line bootstrap
paired_differences:
  # the line's gain in each run: against the context-ablated model, the line term read in another line, and
  # the model without the line term
  - [direct_line_term, direct_mean_input]
  - [direct_line_term, direct_line_term_other_line]
  - [direct_line_term, direct]
  - [direct_mean_token_line_term, direct_mean_token_mean_input]
  - [direct_mean_token_line_term, direct_mean_token_line_term_other_line]
  - [direct_mean_token_line_term, direct_mean_token]
  - [direct_pie_change_line_term, direct_pie_change_mean_input]
  - [direct_pie_change_line_term, direct_pie_change_line_term_other_line]
  - [direct_pie_change_line_term, direct_pie_change]
  - [direct_tx1_gene_line_term, direct_tx1_gene_mean_input]
  - [direct_tx1_gene_line_term, direct_tx1_gene_line_term_other_line]
  - [direct_tx1_gene_line_term, direct_tx1_gene]
  # what the cells add: Tx1-3B cell tokens against none, then the gene-in-line caches against own expression
  - [direct, direct_mean_token]
  - [direct_line_term, direct_mean_token_line_term]
  - [direct_pie_change_line_term, direct_line_term]
  - [direct_tx1_gene_line_term, direct_line_term]
  # what pretraining on the direct target adds: against the finished runs with the same inputs
  - [direct, embedding]
  - [direct_mean_token, embedding_mean_token]
  # the model with the line term against Kebabci's paralog classifier on predicted GeneEffect
  - [direct_line_term, kebabci_paralog_predicted]
