# The SL head trained on the top 10% of each screen's rank as a ramp, against the same head trained on the
# SL call (SL protocol §17). Both read the buffer-aware reader's terms; the two backbone runs differ only
# in `head_target` (configs/sl/conditional_buffer.yaml as conditional_buffer_call_seed0,
# conditional_buffer_ramp.yaml as conditional_buffer_ramp_seed0).
# `hpc/run.sh sl-baselines configs/sl/benchmark_ramp_head.yaml --run-id benchmark_ramp_head_seed0` (CPU).
kind: sl_benchmark_baselines
seed: 0
output_root: outputs/sl
task: benchmark_baselines
labels: data/sl_studies/benchmark_v2/labels.parquet
split: configs/benchmarks/cell_line_sl_split.json
gene_effect: data/sl_dependency_v0/raw/depmap/CRISPRGeneEffect.csv
model: data/sl_dependency_v0/raw/depmap/Model.csv
stage_one: outputs/sl/conditional/conditional_buffer_call_seed0/predictions.parquet
extra_scores:
  buffer_conditional: outputs/sl/conditional/conditional_buffer_call_seed0/scores/conditional.parquet
  buffer_conditional_ablated: outputs/sl/conditional/conditional_buffer_call_seed0/scores/conditional_ablated.parquet
  buffer_head: outputs/sl/conditional/conditional_buffer_call_seed0/scores/head.parquet
  buffer_head_ablated: outputs/sl/conditional/conditional_buffer_call_seed0/scores/head_ablated.parquet
  ramp_head: outputs/sl/conditional/conditional_buffer_ramp_seed0/scores/head.parquet
  ramp_head_ablated: outputs/sl/conditional/conditional_buffer_ramp_seed0/scores/head_ablated.parquet
  # the published baselines of the scoreboard, as scored before
  kebabci_paralog_predicted: outputs/sl/kebabci/predicted_seed0/scores.parquet
  kg4sl: outputs/sl/kg4sl/seed0/scores.parquet
top_k: 20
bootstrap: 1000
# (scorer, control): the per-line difference in recall in the top 10% with the line bootstrap
paired_differences:
  - [ramp_head, buffer_head]
  - [ramp_head, ramp_head_ablated]
  - [buffer_head, buffer_head_ablated]
