# The SL backbone with the buffer-aware reader (configs/sl/conditional_buffer.yaml) whose head trains
# on the top 10% of each screen's rank as a ramp, not on the SL call (SL protocol §17). The penalty
# is still chosen on validation recall in the top 10% of the calls.
# `hpc/run.sh sl-conditional configs/sl/conditional_buffer_ramp.yaml --run-id conditional_buffer_ramp_seed0`
# (CPU); then `hpc/run.sh sl-baselines configs/sl/benchmark_ramp_head.yaml --run-id ID`.
kind: sl_conditional
seed: 0
output_root: outputs/sl
task: conditional
linear_model: configs/linear_model/buffer_aware_reader.yaml
labels: data/sl_studies/benchmark_v2/labels.parquet
split: configs/benchmarks/cell_line_sl_split.json
head_penalties: [0.01, 0.1, 1.0, 10.0, 100.0]
top_k: 20
# DepMap's per-screen GeneEffect and its screen-to-line map: the stage-one ceiling (one screen of
# a line as the prediction of another)
screen_gene_effect: data/sl_dependency_v0/raw/depmap/ScreenGeneEffect.csv
screen_map: data/sl_dependency_v0/raw/depmap/CRISPRScreenMap.csv
# the reader's expression space: null, the genes every held-out line measures; a share, the genes
# at least that share of the labelled single-cell training lines measure (SL protocol §13)
space_measured_share: null
# the head's co-detection inputs: null, real or shuffled (SL protocol §13)
codetection: null
# what the head trains on: call (the screen's SL call) or ramp (the top 10% of the screen's rank
# as a ramp from 0 to 1, SL protocol §17)
head_target: ramp
