# The SL backbone (conditional.yaml, the narrow space) whose head also reads co-detection of A and B
# in the line's cells (SL protocol §13): the share of the cells that detect both genes and its log
# ratio to the share expected under independence, from the cache that `hpc/run.sh sl-codetection`
# writes. `hpc/run.sh sl-conditional configs/sl/conditional_codetection.yaml
# --run-id conditional_codetection_seed0` (CPU)
kind: sl_conditional
seed: 0
output_root: outputs/sl
task: conditional
linear_model: configs/linear_model/default_linear_model.yaml
labels: data/sl_studies/benchmark_v2/labels.parquet
split: configs/benchmarks/cell_line_sl_split.json
head_penalties: [0.01, 0.1, 1.0, 10.0, 100.0]
top_k: 20
screen_gene_effect: data/sl_dependency_v0/raw/depmap/ScreenGeneEffect.csv
screen_map: data/sl_dependency_v0/raw/depmap/CRISPRScreenMap.csv
space_measured_share: null
codetection: real
