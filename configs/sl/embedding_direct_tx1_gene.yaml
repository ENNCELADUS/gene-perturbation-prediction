# configs/sl/embedding_direct.yaml with Tx1-3B's gene embeddings as a gene-in-line feature of the line term (SL
# protocol §19). Needs the tx1_gene cache of configs/sl/gene_in_line.yaml.
# `hpc/run.sh sl-embedding configs/sl/embedding_direct_tx1_gene.yaml --run-id embedding_direct_tx1_gene_seed0_v2` (one GPU).
# Plan: docs/specs/2026-11-20-line-term-and-direct-target-plan.md.
kind: sl_embedding
seed: 0
output_root: outputs/sl
task: embedding
# the SL backbone's line input: bridged pseudo-bulk on the SL split's training side
linear_model: configs/linear_model/default_linear_model.yaml
labels: data/sl_studies/benchmark_v2/labels.parquet
split: configs/benchmarks/cell_line_sl_split.json
# frozen gene sources (hpc/run.sh gene-sources): function text, protein, network
gene_sources:
  gene_text: data/geneeffect_joint/v2/ladder/gene_sources/gene_text.npz
  esmc_600m: data/geneeffect_joint/v2/ladder/gene_sources/esmc_600m.npz
  string_space: data/geneeffect_joint/v2/ladder/gene_sources/string_space.npz
# the cache of each cell's frozen embedding: Tx1-3B (hpc/run.sh ladder-inputs --steps tx1)
cell_embeddings: data/tx1_basal_embeddings/v2_all/real
top_k: 20
model: {hidden: 256, head_hidden: 64}
# cells of a line at one training step, and the rate at which a line reads its mean token alone
cells: {per_step: 256, dropout: 0.25}
stage_one:
  max_epochs: 30
  patience: 3
  learning_rate: 1.0e-3
  weight_decay: 0.01
  lines_per_step: 32
  genes_per_step: 512
stage_two:
  max_epochs: 30
  patience: 5
  steps_per_epoch: 200
  lines_per_step: 4
  rows_per_line: 1024
  learning_rate: 1.0e-3
  backbone_learning_rate: 1.0e-4
  weight_decay: 0.01
  # the GeneEffect loss's weight when the whole model trains; one phase for each
  geneeffect_weights: [1.0]
eval: {rows_per_chunk: 1024, genes_per_chunk: 2048}
# the line head on the gene-in-line features: R is a draw of reference_lines SL training lines at each
# step; own_expression reads the line's own scaled pseudo-bulk value of each gene
line_term:
  reference_lines: 8
  max_epochs: 30
  patience: 5
  learning_rate: 1.0e-3
  own_expression: true
  # Tx1-3B's mean contextual gene embedding (hpc/run.sh sl-gene-in-line configs/sl/gene_in_line.yaml --steps tx1_gene --shard I/N)
  gene_in_line:
    tx1_gene: data/sl_gene_in_line/v1/tx1_gene
