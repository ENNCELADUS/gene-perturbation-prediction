# The gene-knowledge model without cell tokens, with stage one at a tenth of the learning rate (SL protocol §18):
# in configs/sl/embedding_mean_token.yaml's run the GeneEffect loss on the SL training lines was lowest for the
# untrained model, so stage one gave stage two nothing. This run tests if a slower stage one finds a better point.
# `hpc/run.sh sl-embedding configs/sl/embedding_mean_token_slow_stage_one.yaml --run-id ID` (one GPU).
# The run of 2026-11-19 used the residual target (code at bee1bcc); the present code trains on GeneEffect itself.
kind: sl_embedding
seed: 0
output_root: outputs/sl
task: embedding
# the SL backbone's line input: bridged pseudo-bulk on the SL split's training side
linear_model: configs/linear_model/default_linear_model.yaml
labels: data/sl_studies/benchmark_v2/labels.parquet
split: configs/benchmarks/cell_line_sl_split.json
# frozen gene sources (hpc/run.sh gene-sources): function text, protein, network
gene_sources:
  gene_text: data/geneeffect_joint/v2/ladder/gene_sources/gene_text.npz
  esmc_600m: data/geneeffect_joint/v2/ladder/gene_sources/esmc_600m.npz
  string_space: data/geneeffect_joint/v2/ladder/gene_sources/string_space.npz
# no cell tokens
cell_embeddings: null
top_k: 20
model: {hidden: 256, head_hidden: 64}
# not read without cells
cells: {per_step: 256, dropout: 0.25}
stage_one:
  max_epochs: 30
  patience: 3
  # a tenth of configs/sl/embedding.yaml's
  learning_rate: 1.0e-4
  weight_decay: 0.01
  lines_per_step: 32
  genes_per_step: 512
stage_two:
  max_epochs: 30
  patience: 5
  steps_per_epoch: 200
  lines_per_step: 4
  rows_per_line: 1024
  learning_rate: 1.0e-3
  backbone_learning_rate: 1.0e-4
  weight_decay: 0.01
  # the GeneEffect loss's weight when the whole model trains; one phase for each
  geneeffect_weights: [1.0]
eval: {rows_per_chunk: 1024, genes_per_chunk: 2048}
# the line head on the gene-in-line features (null: no line term)
line_term: null
