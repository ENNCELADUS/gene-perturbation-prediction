# The gene-in-line caches (docs/data/gene-in-line-features.md): for each gene of the SL labels in each line, Tx1-3B's
# mean contextual embedding and the share of cells that hold the gene (tx1_gene, GPU), and PIE's predicted change after
# the gene's loss in 64 components fitted on the SL training lines (pie_change, CPU).
# `hpc/run.sh sl-gene-in-line configs/sl/gene_in_line.yaml --steps tx1_gene --shard I/N` (one process per GPU), then
# `hpc/run.sh sl-gene-in-line configs/sl/gene_in_line.yaml --steps pie_change`.
# The CPU caches of the line's cells, the gene's partners and DepMap's DNA calls, one call for each step:
# `hpc/run.sh sl-gene-in-line configs/sl/gene_in_line.yaml --steps STEP` with STEP one of wide_expression, cell_spread,
# paralog_buffer, complex_buffer, partner_low, depmap_mutation, depmap_copy_number.
kind: sl_gene_in_line
seed: 0
# its paths.tx1_model_dir, paths.basal_raw_umi and preparation.var_ensembl_col
joint: configs/revision/frozen_huber.yaml
labels: data/sl_studies/benchmark_v2/labels.parquet
split: configs/benchmarks/cell_line_sl_split.json
# v2 since 2026-11-25: the 10th percentile of a gene is over the SL training lines that measure it. Under v1 a gene
# that one SL training line does not measure had no percentile, so its silenced flag was 0 in every line and it did
# not count as a low partner. v1 keeps the caches that the runs up to 2026-11-24 read; tx1_gene and pie_change did
# not change and are links to v1.
out: data/sl_gene_in_line/v2
tx1: {batch_size: 32, max_length: 2048, max_cells: 256, cells_per_pass: 64}
# the PIE root of hpc/run.sh sl-pie-pass; a seeded sample of training-line vectors fits the components
pie: {root: data/sl_pie/v1, components: 64, sample: 200000}
# the cell files of each line: cells/genes.json and cells/<ModelID>.npz (pseudo-bulk, detected share, SD)
ladder: data/geneeffect_joint/v2/ladder
# its paths.reference gives the paralog and complex tables of the buffer caches
linear_model: configs/linear_model/default_linear_model.yaml
# DepMap's bulk RNA: the wide expression of a labelled bulk-only line (no cell file), mapped gene by gene onto the
# pseudo-bulk with a fit on the SL split's training lines that have a cell file and bulk RNA
bulk_expression: data/sl_dependency_v0/raw/depmap/OmicsExpressionTPMLogp1HumanProteinCodingGenes.csv
# DepMap's damaging and hotspot mutation matrices and the gene-level log2 copy number
depmap:
  damaging: data/sl_dependency_v0/raw/depmap/OmicsSomaticMutationsMatrixDamaging.csv
  hotspot: data/sl_dependency_v0/raw/depmap/OmicsSomaticMutationsMatrixHotspot.csv
  copy_number: data/sl_dependency_v0/raw/depmap/PortalOmicsCNGeneLog2.csv
