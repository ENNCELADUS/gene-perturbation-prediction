# PARIS (Benfatto et al. 2021) on the stage-one reference lines: per dependency gene, a random
# forest of its GeneEffect on the expression of the other genes; selected pairs go to stage two.
# `hpc/run.sh sl-paris configs/sl/paris.yaml --run-id ID [--genes N]` (CPU, .venv-pie; set
# OMP_NUM_THREADS=1). See third_party/paris/PROVENANCE.md. Mode Ginicorrected: a 20-gene raw (Boruta)
# pilot finished no gene in 32 min, so the full raw run would take days (2026-10-23).
ladder_config: configs/stage_one/ladder_inputs.yaml
benchmark: data/sl_screens/benchmark/pairs.parquet
output_root: outputs/sl
task: paris
mode: Ginicorrected  # raw (Boruta) or Ginicorrected (ranger impurity_corrected)
seed: 43
n_jobs: 60  # the container's CPU quota is 64
