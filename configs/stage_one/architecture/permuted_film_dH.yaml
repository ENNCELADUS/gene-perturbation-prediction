# Task 3 of the PIE stage-one design (docs/specs/2026-10-16-pie-geneeffect-ladder-design.md §3.3, §5;
# protocol §16): virtual cell + FiLM (Cilantro) on
# the decoder-feature delta ΔH (768-d, PIE's last decoder layer pooled over the panel); FiLM condition: the gene encoder (gene_text). Control: for each gene, the delta and its slots are read from a seeded
# permutation of the lines (gene identity and spread kept, line content removed).
# `hpc/run.sh stage-one CONFIG [--fold K]`, or every config through `hpc/run.sh stage-one-queue`.
kind: train
task: architecture
seed: 0
output_root: outputs/stage_one
data:
  ladder_config: configs/stage_one/ladder_inputs.yaml
  gene_sources: [gene_text]
  input: dH
  own_slots: [own_dp, own_x]
  permuted: true
  prior_run: null
  genes: panel
model:
  arm: film
  gene_width: 128
  hidden: 256
  state_width: null
  context: null
  trunk: null
train:
  max_epochs: 30
  patience: 5
  warmup_epochs: 1
  learning_rate: 1.0e-3
  weight_decay: 0.01
  ema_decay: null
  lines_per_step: 64
  genes_per_step: 256
  token_dropout: 0.0
  evidence_dropout: 0.0
eval:
  lines_per_chunk: 64
  genes_per_chunk: 2048
