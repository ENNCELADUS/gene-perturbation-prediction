# The per-gene reader (protocol §18; docs/specs/2026-11-12-pie-and-single-cell-plan.md, round B): the default linear
# model's prediction (refitted on the frame; frame lines out of fold, a fold run reads its fold's own fit) plus u_g · h(line),
# with h one shared MLP over the line's 128 expression components (fold-wise in a fold run, standardised on the run's
# training lines) and u_g a weight vector for each selective gene, zero at the start (epoch 0 is the linear model).
# `hpc/run.sh stage-one-queue --gpus ... --folds main,0,1,2,3,4 configs/stage_one/gene_reader/gene_reader_*.yaml ...`.
kind: train
task: gene_reader
seed: 0
output_root: outputs/stage_one
data:
  ladder_config: configs/stage_one/ladder_inputs.yaml
  gene_sources: []
  centre_gene_sources: false
  input: components
  own_slots: []
  permuted: false
  linear_model_run: outputs/stage_one/gene_reader/linear_model_reference_20261113
  genes: selective
model:
  arm: gene_reader
  gene_width: 32
  hidden: 256
  state_width: null
  context: null
  trunk: null
train:
  max_epochs: 30
  patience: 5
  warmup_epochs: 1
  learning_rate: 1.0e-3
  weight_decay: 0.01
  ema_decay: null
  dependency_weight: 1.0
  lines_per_step: 64
  genes_per_step: 256
  token_dropout: 0.0
  evidence_dropout: 0.0
eval:
  lines_per_chunk: 64
  genes_per_chunk: 2048
