# The stage-one inputs (PIE stage-one design §5 Task 2; plan docs/specs/2026-10-16-pie-ladder-inputs-plan.md):
# the frame, the mean channel and PIE's input, the cell channels, the summaries, Tx1 embeddings of every cell and the
# frozen PIE's deltas. The default prior's config gives the split, labels, bulk RNA and dropped lineages; the noise
# diagnosis's gives the programs and cluster settings of the summaries.
# `hpc/run.sh ladder-inputs CONFIG --steps ...` and `hpc/run.sh pie-precompute CONFIG --steps ...`.
seed: 0
prior_config: configs/context_prior/default_prior.yaml
noise_config: configs/context_prior/noise_diagnosis.yaml
ladder_root: data/geneeffect_joint/v2/ladder
paths:
  gene_text: data/pie/hf/datasets/arcinstitute/pie_sources/cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/gene_text
  pie_checkpoint: data/pie/released/PIE_replogle_xdataset@f6da9607226139a1040b6992736118c9b5c7c313/best_auprc.ckpt
  # The Cellosaurus text of every line (src.data.builders.cellosaurus_context, on the Mac), a PIE context_text source.
  context_text: data/geneeffect_joint/v2/ladder/context_text
  tx1_cache: data/tx1_basal_embeddings/v2_all
frame: {folds: 5}
pie: {pilot_genes: 200, components: 512, lines_per_batch: 64}
tx1: {batch_size: 32, max_length: 2048}
