[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vcc"
version = "0.1.0"
description = "Reverse Perturbation Prediction for CRISPR Perturb-seq"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0.0",
    "anndata==0.12.6",
    "h5py==3.15.1",
    "numba==0.62.1",
    "numpy==1.26.4",
    "pandas==2.1.4",
    "pyarrow>=14.0.2",
    "pyyaml==6.0.3",
    "scanpy>=1.11.2",
    "scgpt>=0.2.0",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "torch==2.2.0",
    "tqdm>=4.67.1",
    "umap-learn==0.5.9.post2",
]

[project.optional-dependencies]
research = [
    "datasets>=2.10.0",
    "scib>=1.1.0",
]
viz = [
    "matplotlib==3.10.7",
    "networkx==3.5",
    "seaborn==0.13.2",
    "tabulate==0.9.0",
]

[dependency-groups]
dev = [
    "ipython>=8.18.1",
    "pytest>=8.3.5",
    "ruff>=0.11.8",
    "tabulate==0.9.0",
]

[tool.uv]
default-groups = ["dev"]

# flash-attn is intentionally not declared here. It is a CUDA/build-host-specific
# optional acceleration backend for scGPT, and should be installed manually on
# compatible GPU machines after `uv sync` when needed.

[project.scripts]
vcc = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/scripts",
    "/src",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]
extend-exclude = [
    "scGPT",
    "data/",
    "docs/",
]

[tool.ruff.lint]
select = ["E", "W", "F"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
