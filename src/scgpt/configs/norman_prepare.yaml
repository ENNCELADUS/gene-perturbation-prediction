run_config:
  stages: ["prepare"]
  seed: 42
  train_log_path: results/scgpt/train.log
  eval_log_path: results/scgpt/eval_results.json
  save_checkpoint_path: results/scgpt/best_model.pt
  load_checkpoint_path: results/scgpt/best_model.pt
  save_best_only: true

device_config:
  device: "cpu"
  ddp_enabled: false
  use_mixed_precision: false

data_config:
  h5ad_path: data/norman/perturb_processed.h5ad
  condition_key: condition
  control_key: control
  control_n_samples: 16
  num_workers: 0
  condition_split_path: data/norman/norman_gene_heldout_split.yaml
  condition_split:
    train: []
    validation: []
    test: []
  split_config:
    strategy: gene_heldout
    train_gene_fraction: 0.8
    validation_gene_fraction: 0.09
    test_gene_fraction: 0.11
    min_cells_per_condition: 1

model_config:
  model: scgpt
  pretrained_dir: model/scGPT
  freeze_encoder: true
  freeze_layers_up_to: 10
  preprocess_binning: 51
  score_mode: dot
  head_hidden_dim: 512
  head_dropout: 0.2
  use_fast_transformer: false
  fast_transformer_backend: flash

training_config:
  epochs: 1
  batch_size: 32
  learning_rate: 5.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0

evaluation_config:
  top_k_values: [1, 5, 10, 20, 40]
